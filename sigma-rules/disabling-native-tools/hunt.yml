title: Windows Registry Editing Tools Disabled With Reg.exe
id: 01861ded-a563-55c2-253e-8c80fb7f88b0
status: experimental
description: >
  Detects reg.exe enabling the per-user DisableRegistryTools policy, which
  prevents Registry Editor from starting. The rule binds the executable,
  policy path, value name, write operation, DWORD type, and enabled value so a
  generic DWORD write cannot satisfy the hunt.
author: zendannyy
date: 2026/09/14
references:
  - https://attack.mitre.org/techniques/T1112/
  - https://github.com/redcanaryco/atomic-red-team/tree/master/atomics/T1112
  - https://any.run/report/ea4ea08407d4ee72e009103a3b77e5a09412b722fdef67315ea63f22011152af/a866d7b1-c236-4f26-a391-5ae32213dfc4
  - https://www.microsoft.com/en-us/security/blog/2022/06/13/the-many-lives-of-blackcat-ransomware/
tags:
  - attack.defense_evasion
  - attack.t1112
  - detection.maturity.hunt
logsource:
  product: windows
  category: process_creation
detection:
  selection_binary:
    Image|endswith: '\reg.exe'
  selection_path:
    CommandLine|contains:
      - 'HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Policies\System'
      - 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\System'
  selection_value:
    CommandLine|contains: 'DisableRegistryTools'
  selection_write:
    CommandLine|contains|all:
      - ' add '
      - '/t REG_DWORD'
  selection_enabled:
    CommandLine|re: '(?i)(?:^|\s)/d\s+1(?:\s|$)'
  condition: selection_binary and selection_path and selection_value and selection_write and selection_enabled
fields:
  - ParentImage
  - Image
  - CommandLine
  - User
falsepositives:
  - Authorized Group Policy, kiosk, or workstation-hardening changes performed with reg.exe
  - Security assessment activity that executes Atomic Red Team T1112 test 10
level: medium
