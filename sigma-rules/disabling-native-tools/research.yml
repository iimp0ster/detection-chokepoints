title: Windows Registry Editing Tools Policy Modified
id: d4db5ff3-8ece-4b53-9295-7aeb4dd3b7dc
status: experimental
description: >
  Baselines reg.exe modification of the per-user DisableRegistryTools policy.
  This policy prevents Registry Editor from starting and may be abused to
  impede administration or remediation. This research tier intentionally
  observes both enabling and disabling changes; use the hunt tier for the
  narrower enabled-policy behavior.
author: zendannyy
date: 2026/09/14
references:
  - https://attack.mitre.org/techniques/T1112/
  - https://github.com/redcanaryco/atomic-red-team/tree/master/atomics/T1112
  - https://any.run/report/ea4ea08407d4ee72e009103a3b77e5a09412b722fdef67315ea63f22011152af/a866d7b1-c236-4f26-a391-5ae32213dfc4
  - https://www.microsoft.com/en-us/security/blog/2022/06/13/the-many-lives-of-blackcat-ransomware/
tags:
  - attack.defense_evasion
  - attack.t1112
  - detection.maturity.research
logsource:
  product: windows
  category: process_creation
detection:
  selection_binary:
    Image|endswith: '\reg.exe'
  selection_path:
    CommandLine|contains:
      - 'HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Policies\System'
      - 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\System'
  selection_value:
    CommandLine|contains: 'DisableRegistryTools'
  condition: selection_binary and selection_path and selection_value
fields:
  - ParentImage
  - Image
  - CommandLine
  - User
falsepositives:
  - Authorized Group Policy, kiosk, or workstation-hardening changes
  - Security assessment activity that executes Atomic Red Team T1112 test 10
level: informational
