title: Scheduled Task Registration From Writable Paths
id: 02fb88c4-d939-42ce-9443-ecdd233487ad
status: experimental
description: Detects creation of a Windows scheduled task whose definition references a commonly writable path or invokes the source-grounded headless encoded PowerShell action shape.
references:
- https://www.huntress.com/blog/the-gentlemen-ransomware-defense-evasion-ttps
- https://www.huntress.com/blog/exodus-crypto-wallet-installer-rat
- https://attack.mitre.org/techniques/T1053/005/
author: '@iimp0ster'
date: 2026/09/07
tags:
- attack.persistence
- attack.t1053.005
- detection.maturity.research
logsource:
  product: windows
  service: security
detection:
  selection_event:
    EventID: 4698
  selection_path:
    TaskContent|contains:
    - '\AppData\'
    - '\Temp\'
  selection_headless_powershell:
    TaskContent|contains|all:
    - 'conhost.exe'
    - '--headless'
    - 'powershell'
    - '-e'
  condition: selection_event and (selection_path or selection_headless_powershell)
falsepositives:
- Software updaters and enterprise management tools that register tasks from user-writable paths
- Developer tooling that intentionally uses conhost.exe headless mode to launch encoded PowerShell
level: low
