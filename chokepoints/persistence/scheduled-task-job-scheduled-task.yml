  Logic: 'EventID 4698 and TaskContentNew contains an AppData/Temp path or the conhost.exe --headless PowerShell encoded-command shape.'
  ExpectedFPRate: Medium
  UseCase: 'Broad hunt for scheduler-managed execution from writable locations'
  SigmaRule: 'sigma-rules/scheduled-task-job-scheduled-task/research.yml'
