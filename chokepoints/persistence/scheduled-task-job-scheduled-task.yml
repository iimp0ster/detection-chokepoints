Name: 'Scheduled Task Registration'
Id: 749265c4-5af7-49c3-a9d3-62e2cc9eb8e1
MitreIds:
- T1053.005
- T1053
Tactics:
- Persistence
Techniques:
- 'Scheduled Task/Job: Scheduled Task'
LastUpdated: '2026-09-07'
Author: '@iimp0ster'
DetectionPriority: HIGH
ThreatPrevalence: HIGH
DetectionDifficulty: MEDIUM
Description: >
  Detects the required Windows Task Scheduler registration boundary used by adversaries to obtain scheduler-managed persistence or execution. Task names, triggers, and payloads vary, but the task definition must be registered before Task Scheduler can run it.
Prerequisites:
- 'Windows Security auditing records Event ID 4698 and forwards TaskName and TaskContentNew (or TaskContent) to the telemetry backend.'
AttackerControls:
- 'Task name, trigger, principal, and action command'
- 'Whether registration uses schtasks.exe, PowerShell ScheduledTasks cmdlets, or the Task Scheduler API'
AttackerCannotControl:
- 'A scheduler-managed job requires creation or modification of a task definition'
- 'The operating system must persist the registered task and its execution context'
Chokepoints:
- Stage: 'Task registration request'
  Input: 'A local or remote caller submits a task definition through schtasks.exe, PowerShell, WMI, COM, or the ScheduledTasks API'
  Invariant: 'Scheduler-managed execution begins with a task-registration request containing a trigger, principal, and action.'
  Observable: 'Process, PowerShell, WMI, or RPC telemetry records the caller and registration interface before the task can be accepted.'
  WhyCantBypass: 'Changing the registration API changes the caller telemetry but does not remove the required registration request.'
  LogSources:
  - 'Process creation, PowerShell Script Block Logging, WMI Activity, or Task Scheduler RPC telemetry'
  DetectionTier: Hunt
  SigmaRef: 'sigma-rules/scheduled-task-job-scheduled-task/hunt.yml'
- Stage: 'Task definition registration'
  Input: 'A task name, trigger, principal, and action supplied through a supported Task Scheduler interface'
  Invariant: 'The adversary must register or modify a Windows scheduled task before Task Scheduler can execute the documented job.'
  Observable: 'Security Event 4698/4702 and TaskScheduler Operational telemetry describe the registered definition and execution context.'
  WhyCantBypass: 'Changing the task name, trigger, payload, or registration API does not remove the scheduler registration required for scheduler-managed execution.'
  LogSources:
  - 'Windows Security Event ID 4698/4702'
  - 'Microsoft-Windows-TaskScheduler/Operational'
  - 'Process creation for schtasks.exe or PowerShell ScheduledTasks cmdlets'
  DetectionTier: Research
  SigmaRef: 'sigma-rules/scheduled-task-job-scheduled-task/research.yml'
- Stage: 'Scheduler-managed execution context'
  Input: 'The persisted task definition is evaluated under its declared trigger and principal'
  Invariant: 'Task Scheduler must load the registered definition before it can launch the action in scheduler context.'
  Observable: 'TaskScheduler Operational events and correlated process creation expose the task identity, principal, and spawned action.'
  WhyCantBypass: 'An adversary can avoid execution telemetry only by abandoning Task Scheduler, which exits this chokepoint.'
  LogSources:
  - 'Microsoft-Windows-TaskScheduler/Operational and process creation telemetry'
  DetectionTier: Analyst
  SigmaRef: 'sigma-rules/scheduled-task-job-scheduled-task/analyst.yml'
Variations:
- Name: 'The Gentlemen WindowsConnSvc task'
  FirstSeen: '2026-05-21'
  Status: Emerging
  SourceURL: 'https://www.huntress.com/blog/the-gentlemen-ransomware-defense-evasion-ttps'
  Notes: 'The report documents a SYSTEM scheduled task named WindowsConnSvc launching C:\Windows\Temp\svchost32.exe for persistent C2 access.'
  Command:
    Context: 'A command shell creates a SYSTEM task named WindowsConnSvc on a minute schedule.'
    Invocation: 'schtasks /create /tn WindowsConnSvc /tr C:\Windows\Temp\svchost32.exe /sc minute /ru SYSTEM'
    Artifacts:
    - 'TaskName: WindowsConnSvc'
    - 'Action path: C:\Windows\Temp\svchost32.exe'
  VariantId: 'gentlemen-windowsconnsvc'
  ChokepointMapping: 'The task name and payload are attacker-controlled; Windows still requires a persisted Task Scheduler definition.'
- Name: 'Exodus RAT INetHealth task'
  FirstSeen: '2026-09-01'
  Status: Emerging
  SourceURL: 'https://www.huntress.com/blog/exodus-crypto-wallet-installer-rat'
  Notes: 'The report documents an INetHealth scheduled task launching headless PowerShell with an encoded command.'
  Command:
    Context: 'A scheduled task named INetHealth launches a headless PowerShell action.'
    Invocation: 'conhost.exe --headless powershell -e [Base64 blob; encoded value not published by the source]'
    DecodedPayload: |
      $xbzshxel = @'
      [DllImport("wininet.dll", SetLastError = true, CharSet=CharSet.Auto)]
      public static extern bool InternetSetOption(IntPtr hInternet, int dwOption, IntPtr lpBuffer, int dwBufferLength);
      '@
      $hapiuysw = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings"
      Set-ItemProperty -path $hapiuysw ProxyEnable   -value 0  -ErrorAction Stop
      Set-ItemProperty -path $hapiuysw ProxyServer   -value "" -ErrorAction Stop
      Set-ItemProperty -path $hapiuysw AutoConfigURL -Value "" -ErrorAction Stop
      $miihtwvx = Add-Type -MemberDefinition $xbzshxel -Name syjtmthn -PassThru
      $gmsqtp = $miihtwvx::InternetSetOption(0, 39, 0, 0)
      $pfoguq = $miihtwvx::InternetSetOption(0, 37, 0, 0)
    Artifacts:
    - 'TaskName: INetHealth'
    - 'Action includes conhost.exe, powershell, and a Base64-encoded argument'
    - 'Decoded behavior clears ProxyEnable, ProxyServer, and AutoConfigURL, then refreshes WinINet settings'
  VariantId: 'exodus-inethealth'
  ChokepointMapping: 'A different task name and command still cross the same Task Scheduler registration boundary.'
