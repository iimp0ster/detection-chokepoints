PreventionSummary: >
  Restrict who can register tasks and which binaries Task Scheduler may launch. Application control and least-privilege task-registration policy reduce abuse even when an attacker changes the task name, trigger, or registration API.
PreventionOpportunities:
- Category: 'Endpoint · Application Control'
  Control: 'Block or constrain task actions that execute unsigned binaries and interpreters from user-writable or temporary directories.'
  Impact: 'Prevents the most common malicious task actions from progressing after registration while preserving approved scheduler use.'
- Category: 'Identity · Least Privilege'
  Control: 'Limit remote administration and local principals permitted to create SYSTEM-level scheduled tasks.'
  Impact: 'Reduces the identities able to cross the task-registration boundary with elevated execution context.'
