PreventionSummary: >
  Remove the SSH access that delivers the code, and make the staging
  directories unusable for execution. Egress filtering alone does not help
  because the attacker tunneled all C2 through SSH reverse forwards — the
  firewall never saw outbound traffic.
PreventionOpportunities:
  - Category: Identity
    Control: Key-based SSH authentication only; disable password login on internet-facing hosts
    Impact: Removes the credential-based access path
  - Category: Endpoint
    Control: Mount /tmp, /var/tmp and /dev/shm with noexec
    Impact: Blocks direct runs from those paths; interpreter runs (sh /tmp/w.sh) still work
  - Category: Endpoint
    Control: Restrict or alert on crontab and systemd user-unit changes by SSH sessions
    Impact: Removes or exposes the deferred launcher used for persistence

