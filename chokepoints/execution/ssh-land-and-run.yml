EmulationScript:
  File: emulation/ssh-land-and-run/emulate.sh
  Language: shell
  AtomicRef: "T1059.004, T1105, T1053.003"
  Description: >
    Eight test variants with pass/fail tracking. Covers scp→bash, scp→chmod+exec,
    heredoc→bash, base64→decode+exec, echo pipe→source, python write→python exec,
    /dev/shm dot-prefix staging, and cron spool write. Each variant writes a
    benign marker payload, runs it, logs the result, then cleans up. Generates
    detection telemetry for auditd and Sysmon validation without downloading or
    executing anything malicious.
  SafetyNotes: >
    Run ONLY in an isolated lab VM. Do NOT run on production hosts. This
    script generates benign telemetry to validate auditd and Sysmon rules.
    All payloads call logger with a CHOKEPOINT_EMULATION tag, then self-clean.

