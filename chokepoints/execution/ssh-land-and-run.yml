PreventionSummary: >
  Remove the access that delivers the code, and make the staging
  directories unusable for execution. Egress filtering alone does not help
  when the attacker tunnels C2 through the access channel — the
  firewall never sees outbound traffic.
PreventionOpportunities:
  - Category: Endpoint
    Control: Mount /tmp, /var/tmp and /dev/shm with noexec
    Impact: Blocks direct execution from those paths; interpreter consumption (sh /tmp/w.sh) still works, so pair with the hunt rule
  - Category: Identity
    Control: Key-based SSH authentication only; disable password login on internet-facing hosts
    Impact: Removes the credential-guessing delivery path used by C0XMO, Rocke, and every honeypot session
  - Category: Endpoint
    Control: Restrict or alert on crontab and systemd user-unit changes by non-administrative processes
    Impact: Removes or exposes the deferred launcher used by 86.22% of linked honeypot runs and by C0XMO and Rocke in the wild
  - Category: Network
    Control: Egress filtering for download utilities (wget, curl, tftp) to known-bad or uncategorised destinations
    Impact: Blocks the fetch-to-file delivery variant (463 honeypot sessions, Rocke, C0XMO). Does not block stdin-to-file or scp delivery.

