Name: Trusted Binary DLL Side-Loading
Id: d86f41ec-b5d4-48f6-b982-a51bdecc0fc8
MitreIds:
  - T1574.001
Tactics:
  - Defense Evasion
  - Execution
Techniques:
  - "Hijack Execution Flow: DLL"
DetectionPriority: HIGH
ThreatPrevalence: MEDIUM
DetectionDifficulty: MEDIUM
Description: >
  Adversaries place an attacker-controlled DLL where a legitimate executable will
  resolve it, then launch that executable so the Windows loader maps the DLL into
  the trusted host process. Host names, DLL names, directories, and delivery chains
  vary, but successful DLL side-loading always produces a host-to-loaded-module
  relationship that can be observed with image-load telemetry.
TheConstant: A trusted host must map the attacker-controlled DLL before its code can execute.
LastUpdated: '2026-07-16'
Author: '@iimp0ster'

Prerequisites:
  - A Windows executable whose DLL resolution behavior can be influenced by placing an attacker-controlled library in a searched location
  - The attacker-controlled file must be a loadable PE library compatible with the selected host process
  - The selected executable must run and invoke the Windows loader for the targeted library

AttackerControls:
  - The legitimate host executable selected for side-loading
  - The malicious DLL contents, filename, and placement path
  - The delivery package, launch mechanism, timing, and surrounding process chain

AttackerCannotControl:
  - The selected host process must resolve and map the attacker-controlled DLL before that DLL's code can execute through side-loading

Chokepoints:
  - Stage: Host-to-Module Load
    Input: >
      A legitimate executable and an attacker-controlled DLL are staged so the
      executable's DLL resolution behavior selects the attacker-controlled library.
    Invariant: >
      The attacker MUST cause the selected executable to resolve and map the
      attacker-controlled DLL into its process before the DLL's code can execute.
    Observable: >
      Windows image-load telemetry records the loading process in Image and the
      mapped library in ImageLoaded. Sysmon Event ID 7 additionally provides
      Signed, SignatureStatus, and hash context when configured.
    WhyCantBypass: >
      If the executable does not map the attacker-controlled DLL, the DLL's code
      does not execute through side-loading; avoiding this observable requires
      abandoning DLL side-loading for a different execution technique.
    LogSources:
      - Sysmon Event ID 7 (Image Loaded)
      - EDR process/module image-load telemetry
    DetectionTier: Research
    SigmaRef: sigma-rules/trusted-binary-dll-sideloading/research.yml
    BypassNote: >
      Image-load telemetry may be disabled, sampled, or unavailable; signature,
      path, and local prevalence context must be tuned to the monitored environment.

Variations:
  - Name: JFMBackdoor via fltMC.exe
    Status: Active
    FirstSeen: '2026-06-02'
    SourceURL: https://www.pwc.com/gx/en/issues/cybersecurity/cyber-threat-intelligence/red-lamassu-open-season.html
    NotesShort: fltMC.exe loads a malicious FLTLIB.dll.
    Notes: >
      PwC reports a legitimate fltMC.exe executable loading FLTLIB.dll in the
      JFMBackdoor chain. PwC observed the files downloaded into the victim's
      %TEMP% directory. Active denotes the campaign state reported on 2026-06-02,
      not independently verified continuing activity.
    VariantId: jfmbackdoor-fltmc-fltlib
    ChokepointMapping: >
      fltMC.exe launched -> Windows loader resolves FLTLIB.dll -> FLTLIB.dll is
      mapped into fltMC.exe before the backdoor loader executes.

  - Name: ValleyRAT via GameBox.exe
    Status: Active
    FirstSeen: '2026-05-20'
    SourceURL: https://labs.k7computing.com/index.php/fake-microsoft-teams-campaign-delivers-valleyrat-via-nsis-installer-and-dll-sideloading/
    NotesShort: GameBox.exe side-loads a malicious utility.dll.
    Notes: >
      K7 Computing documents a legitimate GameBox.exe executable abused to
      side-load utility.dll from the hidden C:\ProgramData\client working directory
      in a ValleyRAT delivery chain. Active denotes the campaign state reported on
      2026-05-20, not independently verified continuing activity.
    VariantId: valleyrat-gamebox-utility
    ChokepointMapping: >
      GameBox.exe launched -> Windows loader resolves utility.dll -> utility.dll
      is mapped into GameBox.exe before the ValleyRAT chain continues.

  - Name: AGINGFLY via BACHU archive executable
    Status: Active
    FirstSeen: '2026-04-20'
    SourceURL: https://cert.gov.ua/article/6288271
    NotesShort: A supplied executable side-loads the companion AGINGFLY loader DLL.
    Notes: >
      CERT-UA reports a BACHU archive containing an executable whose launch uses
      DLL side-loading to start the AGINGFLY loader. The source-grounded handoff
      does not provide a stable host/DLL filename pair, so this variation is kept
      name-agnostic rather than filling unsupported values. Active denotes the
      campaign state reported on 2026-04-20, not independently verified continuing
      activity.
    VariantId: agingfly-bachu-archive
    ChokepointMapping: >
      BACHU archive executable launched -> Windows loader resolves the supplied
      companion library -> the library is mapped into the host to start AGINGFLY.

  - Name: HazyBeacon via mscorsvw.exe
    Status: Active
    FirstSeen: '2025-07-14'
    SourceURL: https://unit42.paloaltonetworks.com/windows-backdoor-for-novel-c2-communication/
    NotesShort: mscorsvw.exe loads a planted mscorsvc.dll from Windows assembly storage.
    Notes: >
      Unit 42 reports a malicious mscorsvc.dll planted in C:\Windows\assembly
      alongside the legitimate mscorsvw.exe executable. System-path placement
      changes the context but does not remove the required host-to-module mapping.
      Active denotes the campaign state reported on 2025-07-14, not independently
      verified continuing activity.
    VariantId: hazybeacon-mscorsvw-mscorsvc
    ChokepointMapping: >
      mscorsvw.exe launched -> Windows loader resolves the planted mscorsvc.dll ->
      mscorsvc.dll is mapped into mscorsvw.exe before HazyBeacon executes.

EvolutionTimeline:
  - Date: 2025-07
    Event: Unit 42 documents HazyBeacon side-loading
    Change: A malicious library is planted in Windows assembly storage beside mscorsvw.exe.
    DetectionImpact: System-directory exclusions cannot be treated as sufficient benign context.
    TheConstant: The selected executable still maps the attacker-controlled DLL.
  - Date: 2026-04
    Event: CERT-UA documents the AGINGFLY chain
    Change: Archive delivery and a separately named executable/library pair are used.
    DetectionImpact: Detection must not depend on a known host or module filename.
    TheConstant: Launching the supplied executable still maps the companion loader DLL.
  - Date: 2026-05
    Event: K7 Computing documents ValleyRAT side-loading
    Change: GameBox.exe and utility.dll are packaged in an NSIS-based delivery chain.
    DetectionImpact: Host/module relationship and trust context remain more durable than package indicators.
    TheConstant: GameBox.exe still maps utility.dll before the malicious chain proceeds.
  - Date: 2026-06
    Event: PwC documents the JFMBackdoor implementation
    Change: fltMC.exe and FLTLIB.dll provide a different trusted-host/library pair.
    DetectionImpact: Another independent pair reinforces image-load telemetry as the shared observation point.
    TheConstant: fltMC.exe still maps FLTLIB.dll before the backdoor loader executes.

Detections:
  - Level: Research
    Description: Baseline executable-to-DLL image-load relationships
    LogSources:
      - Sysmon Event ID 7 (Image Loaded)
      - EDR process/module image-load telemetry
    Logic: >
      Record executable processes loading DLLs using Image and ImageLoaded. This is
      deliberately broad and is intended to establish normal host/module pairs,
      paths, signatures, and prevalence before applying exclusions.
    ExpectedFPRate: High
    UseCase: Visibility baseline and host/module relationship inventory
    SigmaRule: sigma-rules/trusted-binary-dll-sideloading/research.yml
  - Level: Hunt
    Description: Hunt executable hosts loading DLLs from higher-risk staging paths
    LogSources:
      - Sysmon Event ID 7 (Image Loaded)
      - EDR process/module image-load telemetry
    Logic: >
      Select executable-to-DLL image loads from user-writable or source-grounded
      staging paths without filtering valid signatures. Require SIEM-side
      same-directory, recent-file, first-seen, low-prevalence, signer, and hash
      enrichment before escalation.
    ExpectedFPRate: High
    UseCase: Periodic candidate generation for novel side-loading relationships
    SigmaRule: sigma-rules/trusted-binary-dll-sideloading/hunt.yml
  - Level: Analyst
    Description: Detect reproducible source-grounded host/module pairs in their reported campaign directories
    LogSources:
      - Sysmon Event ID 7 (Image Loaded)
      - EDR process/module image-load telemetry
    Logic: >
      Match fltMC.exe/FLTLIB.dll in the reported per-user TEMP directory,
      or GameBox.exe/utility.dll under C:\ProgramData\client. Normal system-directory
      basename relationships do not match. AGINGFLY remains Research/Hunt-only
      because its handoff does not ground filenames or a directory. HazyBeacon also
      remains Research/Hunt-only until the original vulnerable host or representative
      assembly-path telemetry can exercise that selection honestly.
    ExpectedFPRate: Low
    UseCase: SOC alerting after first-seen/rarity, signer, hash, and recent-file enrichment
    SigmaRule: sigma-rules/trusted-binary-dll-sideloading/analyst.yml

