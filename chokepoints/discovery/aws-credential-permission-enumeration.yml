Name: AWS Stolen Credential Permission Enumeration
Id: 445b053d-8e2a-4061-aa49-dd984cbb4701
MitreIds:
- T1580
- T1526
Tactics:
- Discovery
Techniques:
- Cloud Infrastructure Discovery
- Cloud Service Discovery
DetectionPriority: HIGH
ThreatPrevalence: HIGH
DetectionDifficulty: MEDIUM
Description: >
  An operator who obtains AWS credentials — from a leaked .env file, a public repository,
  an exposed CI secret, SSRF against the instance metadata service, or a compromised
  container — usually does not know what those credentials are permitted to do. AWS exposes
  no API returning a principal's effective permissions. Identity-based and resource-based
  allows are generally unioned; permissions boundaries, Organizations SCPs and RCPs, and
  session policies constrain the result, and any explicit deny overrides. Visibility into
  those layers varies by principal and account, so context or a readable policy may settle
  part of the effective set but not reliably all of it. Whatever it does not settle has to be
  tested: the operator calls the relevant API and the AWS service returns an authorization
  outcome. CloudTrail visibility is conditional: the service and operation must be supported,
  the relevant management or data event category and selector must be enabled, and that
  integration must record denied requests. Where CloudTrail emits an event, most services
  populate top-level errorCode, but AWS documents errorCode and errorMessage as optional and
  some report failures inside responseElements, so top-level-only ingestion has blind spots. The
  chokepoint sits in that conditional testing requirement rather than in the tooling or the
  speed, and holds whether the operator runs Pacu, enumerate-iam, CloudFox, the AWS CLI by
  hand, or a bespoke SDK script. How much testing it takes is situational — context, a
  readable identity policy, or a correct first guess can narrow it to a single call — so
  cross-namespace breadth and a denied-then-allowed transition are treated here as Hunt and
  Analyst heuristics for undirected enumeration rather than steps the operator cannot skip.
  T1580 and T1526 apply where the List, Get, and Describe calls actually discover services or
  infrastructure; failed permission tests alone do not instantiate either technique. Unit 42
  observed the pattern directly in the 2024 large-scale .env extortion
  campaign: "At the beginning of every operation for the discovery phase in this campaign,
  attackers ran the GetCallerIdentity API call to verify the identity of the user or role
  assigned to the exposed IAM credential."

LastUpdated: '2026-08-19'
Author: '@NovaSky0x1'

Prerequisites:
- Operator holds valid, unexpired AWS credentials (long-term AKIA* key, temporary ASIA*
  session credentials, or a hijacked console session)
- Operator lacks prior knowledge of the credential's effective permission set
- Network path to AWS API endpoints (public internet; no inbound access to the victim
  environment is required)
- CloudTrail coverage for the supported service operations targeted by the rules. Console
  event history automatically retains supported management events for 90 days, but the Athena
  queries need an explicitly created trail delivering to S3 plus an Athena table over that
  data. Management events are selected by default when a trail is created; S3 delivery, the
  table, and any required data-event selectors are not automatic

# ── Framework analysis ──

AttackerControls:
- Tooling — Pacu, enumerate-iam, CloudFox, WeirdAAL, ScoutSuite/Prowler repurposed as
  offensive enumerators, the aws CLI driven by hand, or raw boto3/SDK scripts
- User-Agent string — attacker-controlled. AWS SDKs and tools commonly expose application-ID
  or custom user-agent metadata, so tool-name matches such as "Pacu" or "Boto3" are not a
  durable signal
- Source IP — commercial VPN, Tor, residential proxy, an attacker-controlled EC2 instance,
  or an instance inside the victim's own account (making the traffic AWS-internal)
- Call pacing and jitter — probes can be spread over hours or days to defeat short windows
- Region selection and ordering
- Which service namespaces to probe, and in what sequence
- Whether enumeration is driven through the API directly or through a hijacked console session
- Read-only probing versus attempting state-changing calls

AttackerCannotControl:
- Effective permissions are not computable from outside AWS. Identity-based and
  resource-based allows are generally unioned; permissions boundaries, Organizations SCPs and
  RCPs, and session policies constrain the result, and any explicit deny overrides. A
  principal generally cannot read the SCPs applied to it or resource policies it has no grant
  on, and visibility into these layers varies by principal and account, so context may settle
  part of the effective set while anything it leaves open can only be established by
  attempting the action
- Permission discovery has no quiet IAM oracle at the service boundary.
  iam:SimulatePrincipalPolicy requires its own permission and can itself be denied, while a
  direct probe still requires an AWS API request and service authorization outcome
- For CloudTrail events that are emitted, errorCode, errorMessage, eventSource, eventTime, and
  the userIdentity block are authored by AWS rather than the caller. Event visibility is
  conditional because it depends on support for the service and operation, the selected event
  category, and whether that integration records denied requests
- Each capability that context leaves unresolved costs at least one AWS API request and service
  outcome. CloudTrail is a conditional detection surface for that request, not part of the
  invariant itself
- sts:GetCallerIdentity requires no IAM permission and therefore always succeeds for any
  valid credential — the one call in the sequence that cannot be denied, and therefore
  cannot be hidden behind a permission failure

# ── Chokepoint stages ──

Chokepoints:
- Stage: Identity Orientation (Optional Research Anchor)
  Input: Valid credentials held; owning identity unknown
  Invariant: >
    Identity-aware enumeration benefits from resolving whether the credential belongs to an
    IAM user or assumed role, because that changes which policy and trust APIs are relevant.
    sts:GetCallerIdentity is a common permissionless sequence anchor, but this stage is
    optional: generic permission probing can proceed without first resolving the identity.
  Observable: >
    CloudTrail: eventSource sts.amazonaws.com, eventName GetCallerIdentity, appearing as the
    first-ever event for a given principal, or the first event from a sourceIPAddress not
    previously associated with that principal. Key the principal on
    useridentity.sessioncontext.sessionissuer.arn for assumed-role sessions and on
    useridentity.arn or useridentity.principalid otherwise, with accessKeyId as a last
    fallback: the ASIA* key rotates per session and an assumed-role ARN repeats only when its
    RoleSessionName is reused, so neither is a dependable long-term baseline identity and a
    history keyed on either looks empty. Frequently followed within seconds by iam:GetUser,
    iam:ListAttachedUserPolicies, iam:ListGroupsForUser, iam:ListUserPolicies, or iam:GetRole.
    On its own GetCallerIdentity is extremely common in legitimate SDK and CI workflows, so
    treat it as a sequence anchor for the later stages.
  WhyCantBypass: >
    This stage can be bypassed. Identity-aware policy or trust enumeration needs the principal
    type, while a generic brute-force routine can probe blindly. Skipping orientation may
    increase the number of calls and denials, but it does not prevent permission testing.
  LogSources:
  - AWS CloudTrail management events (eventSource sts.amazonaws.com)
  - AWS CloudTrail management events (eventSource iam.amazonaws.com)
  DetectionTier: Research
  SigmaRef: sigma-rules/aws-credential-permission-enumeration/research.yml
  BypassNote: >
    Operators who already know the identity, or tools that probe blindly, skip this stage.
    Treat it only as a Research-tier sequence anchor and never deploy it on its own.
  TruePositive:
    Title: CloudTrail — GetCallerIdentity as first observed call for a leaked access key
    Log: |
      {
        "eventVersion": "1.09",
        "userIdentity": {
          "type": "IAMUser",
          "principalId": "AIDAEXAMPLE1234ABCD",
          "arn": "arn:aws:iam::123456789012:user/svc-backup",
          "accountId": "123456789012",
          "accessKeyId": "AKIAEXAMPLE1234ABCD"
        },
        "eventTime": "2026-08-09T14:22:03Z",
        "eventSource": "sts.amazonaws.com",
        "eventName": "GetCallerIdentity",
        "awsRegion": "us-east-1",
        "sourceIPAddress": "203.0.113.45",
        "userAgent": "aws-cli/2.15.30 Python/3.11.8 Linux/6.5.0 exe/x86_64",
        "readOnly": true,
        "eventType": "AwsApiCall",
        "managementEvent": true,
        "recipientAccountId": "123456789012"
      }
    KeySignal: >
      The svc-backup service account has a stable historical sourceIPAddress inside its own VPC
      NAT range. This call arrives from 203.0.113.45, never previously seen for this principal,
      and is the first event in a burst producing authorization failures across six service
      namespaces in the following ninety seconds.

- Stage: Cross-Namespace Permission Probing
  Input: Capability unknown; identity may also be unresolved
  Invariant: >
    Any capability the operator has not already established from context or a readable policy
    MUST be tested by calling the relevant AWS API and reading the outcome. Grants are
    per-service and per-action and the constraining layers are frequently invisible from the
    principal side, so there is no offline inference for the untested part of the set. How far
    that testing spreads is situational: context or a correct first guess may reduce it to a few
    calls, while an operator starting blind samples across namespaces because the grant could
    sit in any of several hundred services. This tier scores breadth as a heuristic for that
    undirected case.
  Observable: >
    CloudTrail, aggregated per principal over a rolling window, where the principal is
    useridentity.sessioncontext.sessionissuer.arn for assumed-role sessions and
    useridentity.arn or useridentity.principalid otherwise, with accessKeyId as a last
    fallback:
      - errorCode in (AccessDenied, AccessDeniedException, UnauthorizedOperation,
        Client.UnauthorizedOperation, AuthorizationError, AuthFailure) — only these
        authorization and authentication failures count as denials, since throttling,
        validation, and missing-resource errors also populate errorCode
      - count of DISTINCT eventSource values carrying those errors >= 5
      - denial ratio (authorization failures / all events by the principal in the window)
        >= 0.5
    Legitimate automation runs a known, stable permission set and sits near a zero percent
    denial rate; where it does generate denials, they repeat on the same few API calls rather
    than spreading across namespaces, so the spread discriminates better than the raw count.
  WhyCantBypass: >
    A capability the operator cannot establish from context has to be attempted, and the AWS
    service returns an authorization outcome. CloudTrail observes that request only when the
    service and operation are supported, the relevant event category is selected, and the
    integration records denied requests. What the operator influences is how much testing is needed, so breadth indicates
    undirected enumeration rather than being an unavoidable step: an operator starting blind
    cannot narrow the search without testing.
  LogSources:
  - AWS CloudTrail management events (all eventSource values)
  DetectionTier: Hunt
  SigmaRef: sigma-rules/aws-credential-permission-enumeration/hunt.yml
  BypassNote: >
    Pacing defeats a short window. Running the same breadth-and-ratio logic over a twenty-four
    hour window helps at query cost, and the Analyst tier's novelty scoring helps against a low
    call rate inside whatever window is configured — but that window is itself one day, so
    multi-day pacing evades it too unless it is widened. Two gaps limit denial coverage: some
    List operations return HTTP 200 with an empty result set rather than AccessDenied when
    constrained by resource policy, and services reporting authorization failures in
    responseElements are invisible to a query reading errorCode alone.
  TruePositive:
    Title: CloudTrail — AccessDenied across six namespaces for one access key in 90 seconds
    Log: |
      {
        "eventVersion": "1.09",
        "userIdentity": {
          "type": "IAMUser",
          "principalId": "AIDAEXAMPLE1234ABCD",
          "arn": "arn:aws:iam::123456789012:user/svc-backup",
          "accountId": "123456789012",
          "accessKeyId": "AKIAEXAMPLE1234ABCD"
        },
        "eventTime": "2026-08-09T14:22:31Z",
        "eventSource": "s3.amazonaws.com",
        "eventName": "ListBuckets",
        "awsRegion": "us-east-1",
        "sourceIPAddress": "203.0.113.45",
        "userAgent": "aws-cli/2.15.30 Python/3.11.8 Linux/6.5.0 exe/x86_64",
        "errorCode": "AccessDenied",
        "errorMessage": "User: arn:aws:iam::123456789012:user/svc-backup is not authorized to perform: s3:ListAllMyBuckets because no identity-based policy allows the s3:ListAllMyBuckets action",
        "readOnly": true,
        "eventType": "AwsApiCall",
        "managementEvent": true,
        "recipientAccountId": "123456789012"
      }
    KeySignal: >
      This is one of thirty-one authorization failures for principal
      arn:aws:iam::123456789012:user/svc-backup within ninety seconds, spanning s3, ec2, iam,
      lambda, secretsmanager, and rds, accounting for 0.94 of all events by the principal in
      the window. The same principal averaged zero denials per day across the preceding thirty
      days, because its production workload calls only s3:PutObject against one bucket.

- Stage: Capability Confirmation
  Input: Probing has returned both allow and deny responses
  Invariant: >
    Any capability the operator goes on to use MUST first have been established, and where
    context did not establish it that means a successful API call. A success in a namespace
    that has just denied the same actor is the clearest evidence enumeration located the
    exploitable path, so this tier scores that transition as follow-on confirmation. It remains
    a heuristic: an operator can stop after the denials, or succeed first with no prior denial.
  Observable: >
    CloudTrail: one or more events with no error code (successful) in an eventSource that
    produced an authorization failure earlier in the window for the same principal (session
    issuer ARN, else caller ARN or principal ID) and the same actor, keyed more tightly on
    useridentity.accesskeyid so one session's denial under a shared role cannot join another
    session's success. Highest fidelity when the successful call is itself sensitive:
    iam:CreateAccessKey, iam:AttachUserPolicy, iam:UpdateAssumeRolePolicy,
    secretsmanager:GetSecretValue, ssm:GetParameter with WithDecryption true, or
    ec2:CreateSnapshot, all management events. s3:GetObject against a
    bucket never previously read by that principal is an equally strong signal, but it is an
    object-level data event and is absent unless a data-event selector covers that bucket, so
    treat it as optional coverage. The correlation stands on management events alone.
  WhyCantBypass: >
    Enumeration can finish with only denials, but any capability the operator actually uses
    still requires a successful AWS API request and service outcome. CloudTrail visibility for
    that action depends on service and operation support, event-category selection, and whether
    the integration records the relevant result. The denied-then-allowed ordering is not required to complete
    permission enumeration; it is scored here as the highest-fidelity confirmation available
    when it occurs, and an operator who already knew where the grant was skips it.
  LogSources:
  - AWS CloudTrail management events (all eventSource values)
  - AWS CloudTrail S3 data events (optional — adds object-level successes such as
    s3:GetObject where a data-event selector covers the bucket)
  DetectionTier: Analyst
  SigmaRef: sigma-rules/aws-credential-permission-enumeration/analyst.yml
  BypassNote: >
    A credential whose very first probed namespace succeeds produces no preceding denial there
    and will not match a strict same-namespace correlation; widen it to "any denial by this
    actor in the window" to catch that case, at some cost in precision. A service reporting
    authorization failure in responseElements rather than errorCode is also read as a success
    by an errorCode IS NULL test, so normalize those first.

# ── Variations ──

Variations:
- Name: Pacu
  FirstSeen: 2018-Q3
  Status: Active
  SourceURL: https://github.com/RhinoSecurityLabs/pacu
  NotesShort: AWS exploitation framework with dedicated permission-brute-force modules
  Notes: >
    Rhino Security Labs' AWS exploitation framework. The iam__enum_permissions module reads
    the principal's own policies where permitted; iam__bruteforce_permissions falls back to
    calling large numbers of read-only APIs and recording which ones are refused. Observed
    deployed on compromised containers in Sysdig's SCARLETEEL 2.0 reporting, where operators
    installed the AWS CLI and Pacu onto exploited workloads and configured them with stolen keys.
  VariantId: pacu
  Command:
    Invocation: run iam__bruteforce_permissions
    Context: >
      Executed after set_keys with the stolen credential. The brute-force module exists
      precisely because the enumeration path is blocked when the credential lacks iam:Get*
      on itself — it is the empirical fallback the chokepoint predicts.
    Artifacts:
    - 'CloudTrail: high-volume errorCode AccessDenied spanning many eventSource values for one principal'
    - 'CloudTrail: sts:GetCallerIdentity preceding the burst'
  ChokepointMapping: >
    set_keys and GetCallerIdentity (orientation) → iam__bruteforce_permissions issuing
    read-only calls across namespaces (cross-namespace probing) → operator pivots to the
    namespace that returned success (capability confirmation)

- Name: enumerate-iam
  FirstSeen: 2019-Q1
  Status: Active
  SourceURL: https://github.com/andresriancho/enumerate-iam
  NotesShort: Purpose-built brute-forcer that calls every known read-only API in sequence
  Notes: >
    Andres Riancho's tool does nothing but the chokepoint behavior: it iterates a generated
    list of non-destructive API calls across the AWS SDK surface and reports which ones the
    supplied credential is permitted to make. With no context to work from it carries no
    inference logic at all, which is the undirected case this chokepoint describes.
  VariantId: enumerate-iam
  Command:
    Invocation: python enumerate-iam.py --access-key AKIAEXAMPLE1234ABCD --secret-key <redacted>
    Context: >
      Run directly against a leaked long-term key, typically immediately after the key is
      recovered from a public repository, exposed .env file, or CI log.
    Artifacts:
    - 'CloudTrail: hundreds to thousands of denied read-only calls in a short window from one principal'
    - 'CloudTrail: authorization-failure ratio approaching 1.0 across dozens of distinct eventSource values'
  ChokepointMapping: >
    GetCallerIdentity (orientation) → bulk read-only API sweep generating mass denials
    (cross-namespace probing) → tool reports the permitted call list (capability confirmation)

- Name: CloudFox
  FirstSeen: 2022-Q4
  Status: Active
  SourceURL: https://github.com/BishopFox/cloudfox
  NotesShort: Attack-path enumerator that maps exploitable permissions rather than inventory
  Notes: >
    Bishop Fox's tool is oriented toward answering "what can I do with this access" rather
    than producing an asset inventory, so its call pattern is broad by design. Denials are
    expected and tolerated by the tool, which continues sweeping other namespaces rather
    than stopping on failure — producing exactly the breadth signature this chokepoint targets.
  VariantId: cloudfox
  Command:
    Invocation: cloudfox aws --profile stolen all-checks
    Context: >
      Run against a configured profile holding stolen credentials, typically as the first
      broad sweep before targeted exploitation.
    Artifacts:
    - 'CloudTrail: Describe*/List*/Get* calls across compute, storage, identity, and secrets namespaces'
    - 'CloudTrail: mixed success and AccessDenied from a single principal in one window'
  ChokepointMapping: >
    GetCallerIdentity (orientation) → all-checks sweep across namespaces (cross-namespace
    probing) → operator targets the namespaces that returned data (capability confirmation)

- Name: Manual AWS CLI enumeration
  FirstSeen: 2015-Q1
  Status: Active
  SourceURL: https://unit42.paloaltonetworks.com/large-scale-cloud-extortion-operation/
  NotesShort: Hand-driven probing with no offensive tooling installed
  Notes: >
    The lowest-sophistication variant and the one that defeats every tool-signature
    detection, because the only binary involved is the official AWS CLI. Unit 42's 2024
    extortion campaign reporting documents operators running GetCallerIdentity at the start
    of every discovery phase and then enumerating across IAM, STS, S3, and SES to establish
    what the exposed credential permitted.
  VariantId: manual-aws-cli
  Command:
    Invocation: aws sts get-caller-identity && aws s3 ls && aws iam list-users && aws ec2 describe-instances
    Context: >
      Typed by hand or wrapped in a short shell loop immediately after harvesting keys from
      an exposed .env file or public repository.
    Artifacts:
    - 'CloudTrail: userAgent shows the stock aws-cli string — indistinguishable from legitimate administration'
    - 'CloudTrail: denials spread across namespaces despite low total call volume'
  ChokepointMapping: >
    aws sts get-caller-identity (orientation) → sequential per-service list/describe calls
    generating denials (cross-namespace probing) → operator repeats the call that succeeded
    (capability confirmation)

# ── Detection strategy ──

Detections:
- Level: Research
  Description: Establish baseline visibility into identity-orientation calls and denial rates per principal
  LogSources:
  - AWS CloudTrail management events
  Logic: >
    Surface every sts:GetCallerIdentity event alongside a per-principal count of authorization
    failures, grouping on the session issuer ARN for assumed-role sessions so a role's history
    survives session rotation. Only the authorization and authentication error codes count as
    failures. Characterises what normal looks like — which principals call GetCallerIdentity
    routinely, which service accounts carry a chronic denial rate, and what the baseline
    distinct-namespace spread is — so use it for baselining rather than alerting.
  ExpectedFPRate: High
  UseCase: Threat research and baselining before deploying the Hunt tier
  SigmaRule: sigma-rules/aws-credential-permission-enumeration/research.yml

- Level: Hunt
  Description: Denial breadth across service namespaces for a single principal in a rolling window
  LogSources:
  - AWS CloudTrail management events
  Logic: >
    Aggregate authorization failures per principal over a rolling window, keyed on the session
    issuer ARN for assumed-role sessions since an ASIA* key rotates per session and an
    assumed-role ARN repeats only when the RoleSessionName is reused. Alert where those
    failures span five or more distinct eventSource values and account for at least 0.5 of the
    principal's events in the window, counting only AccessDenied, AccessDeniedException,
    UnauthorizedOperation, Client.UnauthorizedOperation, AuthorizationError, and AuthFailure.
    Exclude principals on a documented chronic-denial allowlist (drift detection, Config rules,
    backup agents), applying it inside the Athena query too since the Sigma placeholder does
    not affect it. Breadth is a heuristic for undirected enumeration rather than a requirement
    of the technique: a principal denied a hundred times on one API is usually misconfigured,
    while one denied five times across five namespaces is mapping its own permissions.
  ExpectedFPRate: Medium
  UseCase: Scheduled hunt over CloudTrail, or a tuned detection once the chronic-denial allowlist is built
  SigmaRule: sigma-rules/aws-credential-permission-enumeration/hunt.yml

- Level: Analyst
  Description: Novel-denial breadth followed by a first success in a just-denied namespace
  LogSources:
  - AWS CloudTrail management events
  - AWS CloudTrail S3 data events (optional — extends the success half to object-level reads
    where a data-event selector covers the bucket)
  Logic: >
    Correlate the denied-to-allowed transition and score on novelty. Fire where a principal
    generates authorization failures on (eventSource, eventName) tuples never previously
    observed for it — successful or failed — within a thirty-day baseline, across three or more
    distinct namespaces, and subsequently issues a successful call in a namespace that denied it
    earlier in the same window. Counting prior failures in the baseline keeps a routinely denied
    tuple from reading as novel every day. Baseline on the session issuer ARN, since a baseline
    keyed on the ASIA* key is empty on every new session, and join denial to success on a
    tighter actor key (access key first) so one session's denial under a shared role cannot join
    another session's success. Novelty helps against a low call rate inside the observation
    window, which is one day here, so multi-day pacing still evades it unless that window is
    widened at query cost. Apply the chronic-principal allowlist inside the Athena query as well
    as the Sigma stub. Breadth and the transition are heuristics, and an operator can skip either.
  ExpectedFPRate: Low
  UseCase: Production alerting in environments with a stable thirty-day CloudTrail baseline
  SigmaRule: sigma-rules/aws-credential-permission-enumeration/analyst.yml

# ── Evolution timeline ──

EvolutionTimeline:
- Date: 2018-Q3
  Event: Pacu released as a general AWS exploitation framework
  Change: >
    Permission enumeration became a packaged module rather than hand-written scripting,
    lowering the skill floor for post-credential-theft discovery.
  DetectionImpact: >
    Early detections keyed on the Pacu user-agent string, which the framework has always
    permitted operators to change. Those rules aged out immediately.
  TheConstant: >
    Whether packaged or hand-written, the tooling still had to call APIs and read the
    failures. The denials did not change.
- Date: 2019-Q1
  Event: enumerate-iam formalises brute-force permission discovery
  Change: >
    A tool whose entire function is issuing every known read-only API call and recording the
    refusals, making the empirical nature of capability discovery explicit.
  DetectionImpact: >
    Volume-based detections became briefly effective because the tool is extremely noisy,
    then degraded as operators throttled it or sampled a subset of calls.
  TheConstant: >
    Reducing volume reduces coverage of the permission space. The operator can trade noise
    for completeness but cannot obtain both, and each probe still requires an AWS response.
- Date: 2022-Q4
  Event: CloudFox shifts enumeration toward attack-path discovery
  Change: >
    Tooling began prioritising exploitable-permission questions over asset inventory, using
    targeted sweeps rather than exhaustive brute force.
  DetectionImpact: >
    Lowered total call volume enough to slip under naive count thresholds, pushing detection
    toward ratio and breadth measures instead of raw counts.
  TheConstant: >
    Targeting narrows the sweep but does not remove the need to test whatever the operator
    cannot establish from context through the relevant AWS API.
- Date: 2024-Q3
  Event: Unit 42 documents large-scale .env extortion campaign
  Change: >
    Mass opportunistic harvesting of exposed environment files produced enumeration at scale
    against thousands of unrelated accounts, with GetCallerIdentity as the documented opening
    call of every discovery phase.
  DetectionImpact: >
    Confirmed that the orientation-then-probe sequence holds even for low-sophistication,
    high-volume operators using only the stock AWS CLI, defeating all tool-signature detection.
  TheConstant: >
    The operator still did not know what the harvested credential could do, and still had to
    ask AWS one action at a time.

# ── OSINT pivots ──

OsintSources:
- Platform: URLScan
  Query: 'page.url:"/.env"'
  Notes: >
    Finds .env files served publicly over HTTP — the exact harvest vector behind the 2024
    Unit 42 extortion campaign, where operators pulled AWS keys straight from exposed
    environment files and began enumerating within minutes. Pivot on your own domains to
    find the exposure before an operator does.
  URL: https://urlscan.io/search/#page.url%3A%22%2F.env%22
- Platform: Shodan
  Query: 'http.html:"AWS_SECRET_ACCESS_KEY"'
  Notes: >
    Surfaces hosts serving AWS secret material directly in HTTP responses — misconfigured
    app servers, directory listings, and debug endpoints that leak environment content.
    Complements the URLScan pivot by finding exposure Shodan crawled but no one submitted.
  URL: https://www.shodan.io/search?query=http.html%3A%22AWS_SECRET_ACCESS_KEY%22
- Platform: GitHub Code Search
  Query: '"aws_secret_access_key" path:.env'
  Notes: >
    Committed .env files carrying credential material — the dominant public-repo exposure
    path, and the one that feeds opportunistic mass enumeration. High volume but mixed
    signal: many hits are empty placeholders (AWS_SECRET_ACCESS_KEY=) in example files.
    Use the .tfvars pivot below for higher live-credential density.
  URL: https://github.com/search?q=%22aws_secret_access_key%22+path%3A.env&type=code
- Platform: GitHub Code Search
  Query: '"AWS_SECRET_ACCESS_KEY" path:.github/workflows'
  Notes: >
    Hardcoded credentials in CI workflow definitions rather than repository secrets. These
    leak with the repo and typically belong to build roles with unusually broad permissions,
    making them high-value enumeration targets.
  URL: https://github.com/search?q=%22AWS_SECRET_ACCESS_KEY%22+path%3A.github%2Fworkflows&type=code
- Platform: GitHub Code Search
  Query: '"AKIA" path:*.tfvars'
  Notes: >
    Terraform variable files committed with live access key IDs. The highest-signal pivot of
    this set — hits are overwhelmingly real key material rather than placeholders, and IaC
    credentials generally hold provisioning rights, so a compromised one has an enumeration
    surface spanning most of the account.
  URL: https://github.com/search?q=%22AKIA%22+path%3A%2A.tfvars&type=code

