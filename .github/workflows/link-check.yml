name: Link Check (Built Site)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Aggregate chokepoint data
        run: python scripts/aggregate.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1.315.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl "/detection-chokepoints"
        env:
          JEKYLL_ENV: production

      - name: Install HTMLProofer
        run: gem install html-proofer -v '~> 5.2'

      - name: Check internal links in _site
        run: |
          htmlproofer ./_site \
            --disable-external \
            --checks Links,Images,Scripts \
            --assume-extension .html \
            --ignore-files "/assets\/lures\//" \
            --swap-urls "^/detection-chokepoints:"
