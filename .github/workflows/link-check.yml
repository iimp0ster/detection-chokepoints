name: Link Check (Built Site)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Aggregate chokepoint data
        run: python scripts/aggregate.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl "/detection-chokepoints"
        env:
          JEKYLL_ENV: production

      - name: Install HTMLProofer
        run: gem install html-proofer -v '~> 5.2'

      - name: Check internal links in _site
        run: |
          htmlproofer ./_site \
            --disable-external \
            --checks Links,Images,Scripts \
            --assume-extension .html \
            --ignore-files "/assets\/lures\//" \
            --swap-urls "^/detection-chokepoints:"
