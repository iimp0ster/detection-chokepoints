name: Chokepoint Regression

on:
  pull_request:
    paths:
      - "chokepoints/**"
      - "sigma-rules/**"
      - "_layouts/chokepoint.html"
      - "scripts/aggregate.py"
      - "scripts/check_chokepoint_regression.py"
      - "tests/**"
      - ".github/workflows/chokepoint-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Python test dependency
        run: pip install pyyaml

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: |
          python scripts/aggregate.py
          bundle exec jekyll build --baseurl "/detection-chokepoints"

      - name: Run chokepoint regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Print DLL chokepoint regression summary
        run: |
          python scripts/check_chokepoint_regression.py \
            --slug trusted-binary-dll-sideloading \
            --receipt tests/fixtures/trusted-binary-dll-sideloading-validation.json \
            --check-site
