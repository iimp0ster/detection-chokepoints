name: Chokepoint Regression

on:
  pull_request:
    paths:
      - "chokepoints/**"
      - "sigma-rules/**"
      - "_layouts/chokepoint.html"
      - "scripts/aggregate.py"
      - "scripts/check_chokepoint_regression.py"
      - "tests/**"
      - "lens-explorer/**"
      - "research/**"
      - "_includes/detection-lens-explorer.html"
      - "_includes/nav.html"
      - "_includes/chokepoint-sidebar.html"
      - "_includes/chokepoint-scroll-spy.html"
      - "assets/css/detection-lens-explorer.css"
      - "assets/js/detection-lens-explorer.mjs"
      - "assets/data/detection-lens-explorer.v1.json"
      - "schema/detection-lens-explorer.v1.schema.json"
      - "scripts/validate_lens_explorer.py"
      - "catalog-profiles/**"
      - "_includes/catalog-research-profile*.html"
      - "_includes/container-escape-explorer.html"
      - "_includes/defensive-coverage.html"
      - "_includes/defensive-coverage-value.html"
      - "assets/css/telemetry-value.css"
      - "assets/js/defensive-coverage-value.mjs"
      - "assets/js/telemetry-value-*.mjs"
      - "assets/data/telemetry-value/**"
      - "schema/telemetry-value.v1.schema.json"
      - "scripts/validate_telemetry_value.py"
      - "tests/test_telemetry_value.mjs"
      - "assets/css/catalog-research-profile.css"
      - "assets/css/container-escape-explorer.css"
      - "assets/css/defensive-coverage.css"
      - "assets/js/container-escape-explorer.mjs"
      - "assets/js/defensive-coverage.mjs"
      - "assets/data/container-escape-research.v1.json"
      - "assets/data/defensive-coverage/**"
      - "_data/defensive_coverage_profiles.yml"
      - "schema/catalog-research-profile.v1.schema.json"
      - "schema/defensive-coverage.v1.schema.json"
      - "scripts/validate_defensive_coverage.py"
      - "framework/index.html"
      - "index.html"
      - ".github/workflows/chokepoint-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Python test dependency
        run: pip install pyyaml jsonschema

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: |
          python scripts/aggregate.py
          bundle exec jekyll build --baseurl "/detection-chokepoints"

      - name: Run chokepoint regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check defensive coverage and the reviewed graph
        run: |
          python scripts/validate_defensive_coverage.py
          python scripts/validate_telemetry_value.py
          node --test tests/test_defensive_coverage.mjs tests/test_telemetry_value.mjs

      - name: Print DLL chokepoint regression summary
        run: |
          python scripts/check_chokepoint_regression.py \
            --slug trusted-binary-dll-sideloading \
            --receipt tests/fixtures/trusted-binary-dll-sideloading-validation.json \
            --check-site
