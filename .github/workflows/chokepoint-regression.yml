name: Chokepoint Regression

on:
  pull_request:
    paths:
      - "chokepoints/**"
      - "sigma-rules/**"
      - "_layouts/chokepoint.html"
      - "scripts/aggregate.py"
      - "scripts/check_chokepoint_regression.py"
      - "tests/**"
      - ".github/workflows/chokepoint-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Python test dependency
        run: pip install pyyaml

      - name: Set up Ruby
        uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1.313.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: |
          python scripts/aggregate.py
          bundle exec jekyll build --baseurl "/detection-chokepoints"

      - name: Run chokepoint regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Print DLL chokepoint regression summary
        run: |
          python scripts/check_chokepoint_regression.py \
            --slug trusted-binary-dll-sideloading \
            --receipt tests/fixtures/trusted-binary-dll-sideloading-validation.json \
            --check-site
