name: Validate Data

# Schema/format gate for contributed data. Runs on PRs that touch chokepoint
# entries, their referenced detection rules, or the generated trends data files,
# and fails the check on any violation: chokepoint schema errors (missing
# required fields, bad enums, malformed UUID/date/MITRE ids, a Sigma path that
# does not exist) or a trends _data file missing a section/meta key its page
# template depends on.
on:
  pull_request:
    paths:
      - "chokepoints/**"
      - "sigma-rules/**"
      - "iok-rules/**"
      - "_data/**"
      - "scripts/validate_schema.py"
      - "schema/chokepoint-schema.yml"
      - "assets/data/detection-lens-explorer.v1.json"
      - "schema/detection-lens-explorer.v1.schema.json"
      - "scripts/validate_lens_explorer.py"
      - "catalog-profiles/**"
      - "_includes/catalog-research-profile*.html"
      - "_includes/container-escape-explorer.html"
      - "_includes/defensive-coverage.html"
      - "_includes/defensive-coverage-value.html"
      - "_includes/container-escape-sigma.html"
      - "scripts/validate_container_escape_sigma.py"
      - "scripts/fixtures/container-escape-sigma-cases.json"
      - "assets/css/telemetry-value.css"
      - "assets/js/defensive-coverage-value.mjs"
      - "assets/js/telemetry-value-*.mjs"
      - "assets/data/telemetry-value/**"
      - "schema/telemetry-value.v1.schema.json"
      - "scripts/validate_telemetry_value.py"
      - "tests/test_telemetry_value.mjs"
      - "assets/css/catalog-research-profile.css"
      - "assets/css/container-escape-explorer.css"
      - "assets/css/defensive-coverage.css"
      - "assets/js/container-escape-explorer.mjs"
      - "assets/js/defensive-coverage.mjs"
      - "assets/data/container-escape-research.v1.json"
      - "assets/data/defensive-coverage/**"
      - "_data/defensive_coverage_profiles.yml"
      - "schema/catalog-research-profile.v1.schema.json"
      - "schema/defensive-coverage.v1.schema.json"
      - "scripts/validate_defensive_coverage.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml jsonschema pySigma==2.1.2

      - name: Validate chokepoint + trends data
        run: python scripts/validate_schema.py

      - name: Validate Lens Explorer projection
        run: python scripts/validate_lens_explorer.py

      - name: Validate defensive coverage profiles
        run: |
          python scripts/validate_defensive_coverage.py
          python scripts/validate_telemetry_value.py
          python scripts/validate_container_escape_sigma.py
