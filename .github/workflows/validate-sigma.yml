name: Validate Sigma

# Same trigger shape as validate-data.yml: pull_request only, plus manual.
# Deliberately no `push:`, because none of the existing gates use one, and adding it
# would double runs on your own branches.
on:
  pull_request:
    paths:
      - "sigma-rules/**"
      - "scripts/check_sigma.py"
      - "requirements-ci.txt"
      - ".github/workflows/validate-sigma.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sigma:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Pins live in requirements-ci.txt at the repo root rather than inline
      # here, because your dependabot pip entry is `directory: "/"` and reads
      # requirements files. Pins written inside a `run:` step would never be
      # proposed for a bump and would rot silently.
      - name: Install sigma-cli and backend
        run: pip install -r requirements-ci.txt

      # ~50 seconds over 48 rules on a workstation, dominated by process start-up
      # rather than CPU. A hosted runner will be slower, plus the install step.
      # The repository predates this gate and has known conversion debt. PRs
      # must not add to it, while workflow_dispatch retains the explicit full-
      # corpus audit used to pay that debt down deliberately.
      - name: Validate changed Sigma rules
        if: github.event_name == 'pull_request'
        run: python scripts/check_sigma.py --rules-dir sigma-rules --changed-from "${{ github.event.pull_request.base.sha }}"

      - name: Audit the complete Sigma corpus
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/check_sigma.py --rules-dir sigma-rules
